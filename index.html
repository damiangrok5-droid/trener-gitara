C({ id: "subst", t: "Substytucje: tritonowa i wtrącone dominanty", lv: 55, cat: "teoria", pre: ["ii_v_i"], read: "ch",
  what: "Substytut tritonowy zamienia G7 na Des7 (wspólny tryton H–F). Wtrącona dominanta (A7 przed Dm) dodaje kolor. To narzędzia reharmonizacji.",
  steps: ["Dm7–G7–C vs Dm7–Des7–C — porównaj.", "C–A7–Dm–G7 (V/ii).", "Wstaw substytuty w znany standard.", "Improwizuj, celując w nowe tercje."],
  mist: ["Substytucja wszędzie — używaj z umiarem."],
  check: "Reharmonizujesz 8 taktów piosenki dwiema substytucjami.",
  dia: chD("Dm7", "G7", "Cis7", "Cmaj7"), drill: { key: "changes", b0: 20, inc: 2, max: 60, sub: "zmian/min", groove: "swing" } });
C({ id: "harm", t: "Flażolety naturalne i sztuczne", lv: 56, cat: "technika", pre: ["hybrid"], read: "tab",
  what: "Flażolet to dźwięk-alikwot o szklanym brzmieniu. Naturalne: palec lekko dotyka struny nad 12., 7., 5. progiem. Sztuczne: dotykasz 12 progów wyżej palcem prawej ręki; „pinch” — bokiem kciuka przy kostkowaniu (rock).",
  steps: ["Naturalne na 12, 7, 5 — palec dokładnie nad progiem.", "Sztuczne: akord, palec wskazujący prawej dotyka 12 progów wyżej, kciuk/a szarpie.", "Pinch harmonic przy przesterze.", "Melodia z flażoletów."],
  mist: ["Dociskanie struny do gryfu — tylko dotyk.", "Palec nie nad progiem."],
  check: "Czyste flażolety na 12/7/5 na wszystkich strunach i 3 sztuczne pod rząd.",
  dia: tabD("E12 A12 D12 G12 H12 e12 G7 H7 e7"), drill: { key: "fp", b0: 50, inc: 2, max: 90, sub: "ćwierćnuty" } });
C({ id: "comping", t: "Akompaniament jazzowy i walking bass", lv: 57, cat: "rytm", pre: ["drop2", "ii_v_i"], read: "fret",
  what: "Comping to rytmiczny akompaniament jazzowy: krótkie akordy w synkopach. Walking bass na gitarze — linia basowa ćwierćnutami między akordami.",
  steps: ["Freddie Green: shell na 4 ćwierćnuty.", "Charleston: akord na 1 i „i” po 2.", "Walking: 1-3-5-chromatyczne podejście do następnego akordu.", "Blues jazzowy w F z perkusją Swing."],
  mist: ["Za długie akordy, za dużo grania."],
  check: "12 taktów jazz bluesa: chorus comping + chorus walking przy 120 BPM.",
  dia: fd([[0, 1], [0, 3], [1, 0], [1, 1], [1, 3]], 5, 0, 5), drill: { key: "strum", b0: 90, inc: 3, max: 180, sub: "ćwierćnuty", groove: "swing" } });
C({ id: "speed", t: "Budowanie szybkości: burst i sekwencje", lv: 58, cat: "technika", pre: ["economy"], read: "tab",
  what: "Szybkość buduje się krótkimi seriami (burst) powyżej komfortowego tempa i sekwencjami (po 3, po 4, po 6), które uczą płynności.",
  steps: ["Burst: 4 nuty w tempie docelowym + pauza.", "Sekwencja po 4 w pentatonice.", "Metoda 3× czysto → +4 BPM.", "Nagraj i porównaj co tydzień."],
  mist: ["Ćwiczenie na granicy możliwości cały czas — 80% czasu graj czysto, 20% powyżej."],
  check: "Sekwencja po 4 szesnastkami przy 110 BPM czysto.",
  dia: tabD("E5 E8 A5 A7 E8 A5 A7 D5 A5 A7 D5 D7 A7 D5 D7 G5"), drill: { key: "pick", b0: 80, inc: 3, max: 190, sub: "szesnastki" } });
C({ id: "solo_comp", t: "Komponowanie solówki", lv: 59, cat: "teoria", pre: ["impro2", "modal_impro"], read: "fret",
  what: "Dobra solówka ma dramaturgię: temat, rozwinięcie, kulminację. Komponowanie (nie tylko improwizacja) uczy budowy, motywów i rejestrów.",
  steps: ["Wybierz 16 taktów z utworu.", "Takty 1–4: motyw w niskim rejestrze.", "5–12: rozwinięcie, wyżej, gęściej.", "13–16: kulminacja (bend, wysoki rejestr) i rozwiązanie."],
  mist: ["Kulminacja na początku.", "Brak motywu."],
  check: "Nagrana 16-taktowa solówka z wyraźnym motywem i kulminacją.",
  dia: pentaBox(9, 5, 17), drill: { key: "impro", b0: 70, inc: 2, max: 130, sub: "frazy", groove: "rock" } });

C({ id: "sweep_tap", t: "Sweep z tappingiem i zmianą pozycji", lv: 60, cat: "technika", pre: ["sweep5", "tapping"], read: "tab",

C({ id: "superimp", t: "Superimpozycja arpeggiów", lv: 61, cat: "teoria", pre: ["arp7", "modal_impro"], read: "fret",
  what: "Grasz arpeggio innego akordu na tle podstawowego, żeby uzyskać rozszerzenia: Em7 na Cmaj7 daje Cmaj9, Hm7♭5 na G7 daje G9.",
  steps: ["Na Cmaj7 graj arpeggio Em7 (3-5-7-9).", "Na Am7 graj Cmaj7 (♭3-5-♭7-9).", "Na G7 graj Hm7♭5.", "Improwizuj, mieszając arpeggio podstawowe i nałożone."],

C({ id: "bebop", t: "Język bebopu: skale bebopowe i enclosure", lv: 62, cat: "skale", pre: ["ii_v_i", "arp7"], read: "fret",
  what: "Skala bebopowa dominantowa (miksolidyjska + wielka septyma przejściowa) sprawia, że akordowe dźwięki wypadają na mocne części taktu. Enclosure — okrążanie nuty docelowej z góry i z dołu.",

C({ id: "chord_melody", t: "Chord melody", lv: 63, cat: "akordy", pre: ["drop2"], read: "fret",
  what: "Granie melodii i harmonii naraz: melodia na najwyższej strunie, akord (drop 2/drop 3 lub shell) pod nią. Gitara solo jak fortepian.",

C({ id: "altered", t: "Skala alterowana", lv: 64, cat: "skale", pre: ["mmin", "bebop"], read: "fret",
  what: "7. mod molowej melodycznej (G alterowana = As-moll melodyczna od G): ♭9, #9, #11, ♭13 nad G7. Maksymalne napięcie przed rozwiązaniem do C.",

C({ id: "classical", t: "Technika klasyczna: apoyando, tirando, arpeggia p-i-m-a", lv: 65, cat: "technika", pre: ["fp_intro", "hybrid"], read: "tab",
  what: "Klasyczna prawa ręka: tirando (palec nie dotyka sąsiedniej struny) i apoyando (opiera się o nią — głośniej, do melodii). Arpeggia p-i-m-a z Giulianiego.",

  mist: ["Napięty nadgarstek.", "Nierówne natężenie palców."],
  check: "Arpeggia Giulianiego 1–5 triolami przy 80 BPM.",

C({ id: "flamenco", t: "Flamenco: rasgueado i frygijska", lv: 66, cat: "rytm", pre: ["lyd_phr", "strum_adv"], read: "rh",
  what: "Rasgueado to wachlarzowe uderzenia palcami (e-a-m-i). Kadencja andaluzyjska Am–G–F–E i skala frygijska dominantowa to serce flamenco.",
  steps: ["Rasgueado 4-palcowe e-a-m-i na Em.", "Kadencja Am–G–F–E.", "Compás 12 (solea): akcenty 3, 6, 8, 10, 12.", "Melodia w E frygijskiej dominantowej."],

  { id: "t7", t: "Koło kwintowe", ic: "⭕", lessons: [
    { id: "t7a", t: "Mapa wszystkich tonacji", txt: ["Idąc zgodnie z zegarem, każda tonacja jest kwintę wyżej i ma o 1 krzyżyk więcej: C → G → D → A → E → H.", "W lewo (kwarta wyżej) przybywa bemoli: C → F → B → Es → As.", "Wewnątrz koła są tonacje równoległe molowe. Dotknij tonacji w trenażerze koła, żeby usłyszeć jej akordy."], vis: { k: "circle" } },
    { id: "t7b", t: "Do czego się przydaje", txt: ["Sąsiedzi na kole świetnie razem brzmią. Akordy C-dur: C (dom), po bokach F i G, a wewnątrz Am, Dm, Em.", "Progresje często „chodzą po kole” w lewo: E → A → D → G → C (np. w jazzie i rocku).", "Chcesz zmienić tonację piosenki „łagodnie”? Przejdź do sąsiada na kole."], vis: { k: "circle", sel: 0 } }],

function derive() {

/* ---------- v2.1.1: podstrony — pasek „‹ Wstecz”, historia (gest wstecz iOS), przesunięcie od krawędzi ---------- */
let navKey = null, ignorePops = 0, lastPop = 0; const navScroll = {};

function subPage() {
  if (!S) return null;
  if (ui.retest) return { key: "retest", back: () => { ui.retest = false; } };
  if (ui.tab === "utwory" && ui.songId) return { key: "song:" + ui.songId, back: () => { ui.songId = null; } };
  if (ui.tab === "akordy" && (ui.know || "teoria") === "teoria" && ui.thCh) return { key: "th:" + ui.thCh, back: () => { ui.thCh = null; } };
  return null;
}
function syncNav() {
  const sp = subPage(); const key = sp ? sp.key : null;
  document.body.classList.toggle("sub", !!sp);
  if (key === navKey) return;
  const st = history.state || {};
  try {

    else if (st.tg) { ignorePops++; history.back(); }

}
function rememberScroll() { navScroll[ui.tab] = window.scrollY; }
function leaveSub(sp) { sp.back(); render(); const y = navScroll[ui.tab]; window.scrollTo(0, y > 0 ? y : 0); }
function navGoBack() {
  const sp = subPage(); if (!sp) return;
  const st = history.state || {};
  if (st.tg === sp.key && !st.ov) { history.back(); return; } // popstate zamknie podstronę

}

  const st = e.state || {}; const sheet = document.getElementById("post-play");

    if (sheet) sheet.remove();
    if (typeof STAGE !== "undefined" && STAGE) closeStage(true);

    return;
  }

document.getElementById("nav-back").addEventListener("click", navGoBack);
(function edgeSwipe() {
  let sx = -1, sy = 0, t0 = 0;
  document.addEventListener("touchstart", (e) => { const t = e.touches[0]; sx = e.touches.length === 1 && t.clientX < 24 && subPage() && !document.body.classList.contains("stage-open") && !document.getElementById("post-play") ? t.clientX : -1; sy = t.clientY; t0 = Date.now(); }, { passive: true });
  document.addEventListener("touchend", (e) => {

function onScroll() { document.getElementById("navbar").classList.toggle("show", window.scrollY > 48); }
