<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trener Gitara</title>
<meta name="description" content="Twój osobisty trener gitary: test poziomu, codzienne lekcje, metronom, stroik i biblioteka akordów.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trener Gitara">
<meta name="application-name" content="Trener Gitara">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF2D55'/%3E%3Cstop offset='1' stop-color='%23AF52DE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle'%3E%F0%9F%8E%B8%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  color-scheme:light dark;
  --bg:#F2F2F7;--bg-elev:#FFFFFF;--card:rgba(255,255,255,.74);--card-strong:rgba(255,255,255,.9);
  --line:rgba(60,60,67,.13);--line2:rgba(60,60,67,.32);
  --text:#000;--text2:rgba(60,60,67,.64);--text3:rgba(60,60,67,.38);
  --fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);--thumb:#fff;
  --blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--pink:#FF2D55;--purple:#AF52DE;--teal:#30B0C7;--indigo:#5856D6;--yellow:#FFCC00;--mint:#00C7BE;
  --accent:var(--blue);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(17,24,39,.07);
  --shadow-lg:0 20px 50px rgba(17,24,39,.16);
  --blob1:rgba(255,45,85,.20);--blob2:rgba(0,122,255,.18);--blob3:rgba(175,82,222,.16);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--bg-elev:#1C1C1E;--card:rgba(30,30,32,.72);--card-strong:rgba(44,44,46,.92);
  --line:rgba(84,84,88,.42);--line2:rgba(120,120,128,.6);
  --text:#fff;--text2:rgba(235,235,245,.64);--text3:rgba(235,235,245,.34);
  --fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--thumb:#636366;
  --blue:#0A84FF;--green:#30D158;--orange:#FF9F0A;--red:#FF453A;--pink:#FF375F;--purple:#BF5AF2;--teal:#40C8E0;--indigo:#5E5CE6;--yellow:#FFD60A;--mint:#63E6E2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);--shadow-lg:0 20px 50px rgba(0,0,0,.6);
  --blob1:rgba(255,55,95,.22);--blob2:rgba(10,132,255,.20);--blob3:rgba(191,90,242,.20);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;min-height:100vh;letter-spacing:-.01em;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20vh -20vw;z-index:-1;pointer-events:none;
  background:radial-gradient(40vmax 40vmax at 10% 0%,var(--blob1),transparent 60%),radial-gradient(45vmax 45vmax at 100% 25%,var(--blob2),transparent 60%),radial-gradient(40vmax 40vmax at 30% 100%,var(--blob3),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
.app{max-width:640px;margin:0 auto;padding:0 calc(16px + var(--sar)) calc(110px + var(--sab)) calc(16px + var(--sal))}
/* nawigacja górna */
.navbar{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:var(--sat);height:calc(44px + var(--sat));display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;pointer-events:none}
.navbar.show{opacity:1;transform:none}
.navbar b{font-size:17px;font-weight:600}
.large{padding-top:calc(var(--sat) + 22px);padding-bottom:6px}
.large .eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--text2)}
.large h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em;margin:2px 0 0}
.large .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--text2);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600;color:var(--text)}
.chip.tint{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
/* sekcje i karty */
.section{margin-top:26px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.sec-title{font-size:22px;font-weight:700;letter-spacing:.01em;margin:0 4px 4px}
.sec-cap{font-size:14px;color:var(--text2);margin:0 4px 10px}
.card{background:var(--card);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:.5px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--text2);font-size:14px}
.small{font-size:13px;color:var(--text2)}
.ok-text{color:var(--green);font-weight:600}
.warn-text{color:var(--orange)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
/* przyciski */
.btn{appearance:none;border:0;border-radius:14px;min-height:44px;padding:11px 18px;font-size:16px;font-weight:600;background:var(--fill);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,opacity .15s,background .2s;line-height:1.15;text-align:center}
.btn:active{transform:scale(.96);opacity:.85}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.tinted{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.btn.plain{background:transparent;padding:8px 10px;min-height:36px}
.btn.big{width:100%;min-height:52px;font-size:17px;border-radius:16px}
.btn.danger{color:var(--red)}
.btn.danger.primary{background:var(--red);color:#fff;box-shadow:none}
.btn.sm{min-height:34px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn.green{--accent:var(--green)}.btn.orange{--accent:var(--orange)}.btn.pink{--accent:var(--pink)}.btn.purple{--accent:var(--purple)}
/* kontrolka segmentowa */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;min-height:34px}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:8px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .3s cubic-bezier(.3,.9,.3,1)}
.seg button{position:relative;z-index:1;border:0;background:transparent;font-size:13px;font-weight:500;padding:6px 4px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;background:var(--fill);color:var(--text);transition:background .2s,color .2s,transform .15s}
.pill:active{transform:scale(.95)}
.pill.on{background:var(--accent);color:#fff}
/* przełącznik iOS */
.switch{position:relative;width:51px;height:31px;flex:0 0 51px;-webkit-appearance:none;appearance:none;margin:0;border-radius:999px;background:var(--fill2);transition:background .25s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .25s cubic-bezier(.3,.9,.3,1)}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
/* listy w stylu iOS */
.list{border-radius:16px;overflow:hidden;background:var(--card-strong);border:.5px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:46px;position:relative;width:100%;border:0;background:transparent;text-align:left;font-size:16px;transition:background .15s}
button.li:active{background:var(--fill)}
.li + .li::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--line)}
.li .grow{flex:1;min-width:0}
.li .val{color:var(--text2);font-size:15px}
.li .check{color:var(--accent);font-weight:700;width:18px;text-align:center}
.li.correct{background:color-mix(in srgb,var(--green) 16%,transparent)}
.li.wrong{background:color-mix(in srgb,var(--red) 14%,transparent)}
/* pola */
.input{border:0;background:var(--fill);border-radius:12px;padding:10px 12px;min-height:44px;font-size:16px;outline:none}
.input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
textarea.input{width:100%;font-family:var(--mono);font-size:11px;resize:vertical;min-height:64px}
select.input{-webkit-appearance:none;appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
/* pasek zakładek */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);padding:6px calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));
  background:color-mix(in srgb,var(--bg-elev) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--line)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;color:var(--text3);font-size:10px;font-weight:600;letter-spacing:.01em;transition:color .2s}
.tab svg{width:26px;height:26px;transition:transform .25s cubic-bezier(.3,.9,.3,1)}
.tab.on{color:var(--accent)}
.tab.on svg{transform:translateY(-1px) scale(1.06)}
.tab:active svg{transform:scale(.88)}
.tab .badge{position:absolute;margin-left:22px;width:8px;height:8px;border-radius:50%;background:var(--red)}
/* toast */
.toast{position:fixed;left:50%;top:calc(10px + var(--sat));z-index:60;transform:translate(-50%,-140%);max-width:min(92vw,520px);display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:18px;
  background:var(--card-strong);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow-lg);border:.5px solid var(--line);font-size:15px;font-weight:500;transition:transform .45s cubic-bezier(.2,.9,.2,1.1)}
.toast.show{transform:translate(-50%,0)}
/* pierścienie */
.rings-card{display:flex;align-items:center;gap:18px}
.rings{width:132px;height:132px;flex:0 0 132px}
.rings circle.prog{transition:stroke-dashoffset 1.2s cubic-bezier(.3,.8,.2,1)}
.legend{display:flex;flex-direction:column;gap:10px;min-width:0}
.legend .k{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.legend .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.legend .v small{font-size:14px;color:var(--text2);font-weight:600}
/* hero */
.hero{border-radius:26px;padding:22px;color:#fff;background:linear-gradient(135deg,#FF2D55 0%,#AF52DE 55%,#5856D6 100%);box-shadow:0 18px 40px rgba(175,82,222,.35);position:relative;overflow:hidden}
.hero::after{content:"🎸";position:absolute;right:-6px;bottom:-18px;font-size:120px;opacity:.22;transform:rotate(-18deg)}
.hero h2{margin:0 0 6px;font-size:26px;line-height:1.15}
.hero p{margin:0;opacity:.92;font-size:15px}
.hero .btn{background:rgba(255,255,255,.95);color:#5E2BD8;box-shadow:none}
.hero .btn.ghost{background:rgba(255,255,255,.2);color:#fff}
.level-card{border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--indigo) 60%,var(--purple));box-shadow:0 14px 34px rgba(88,86,214,.32)}
.level-card .lv{font-size:28px;font-weight:800;line-height:1.1;margin:4px 0 6px}
.level-card .small{color:rgba(255,255,255,.85)}
/* bloki lekcji */
.block{padding:0;overflow:hidden;transition:box-shadow .3s}
.block-h{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.bicon{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;box-shadow:0 4px 10px color-mix(in srgb,var(--c) 40%,transparent);background:linear-gradient(145deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c))}
.bicon.done{animation:pop .45s both}
.block-h .meta{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--c)}
.block-h .ttl{font-size:16px;font-weight:600;line-height:1.25;margin-top:1px}
.chev{width:20px;height:20px;color:var(--text3);transition:transform .3s}
.block.open .chev{transform:rotate(90deg)}
.block-b{display:none;padding:0 16px 16px}
.block.open .block-b{display:block;animation:rise .35s both}
.block ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.4}
.divider{height:.5px;background:var(--line);margin:4px 0}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{padding:10px 6px;font-size:15px}
.done-note{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:600;font-size:14px}
pre.tab{font-family:var(--mono);font-size:12.5px;line-height:1.38;background:var(--fill);border-radius:14px;padding:12px;overflow-x:auto;margin:0}
.prog{display:flex;flex-wrap:wrap;gap:6px}
.prog span{font-family:var(--mono);font-size:16px;font-weight:600;padding:8px 13px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.pattern{display:grid;gap:4px}
.pattern .slot{text-align:center;border-radius:10px;padding:6px 0;background:var(--fill)}
.pattern .slot.on{background:color-mix(in srgb,var(--pink) 16%,transparent);color:var(--pink)}
.pattern .slot b{display:block;font-size:20px;line-height:1.1;min-height:22px}
.pattern .slot span{font-size:11px;color:var(--text2)}
/* diagram akordu */
.chords{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.chord{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:16px;padding:8px 4px 4px;transition:transform .15s,background .2s}
.chord.play{cursor:pointer;background:var(--card-strong);border:.5px solid var(--line)}
.chord.play:active{transform:scale(.95)}
.chord.ring{animation:pop .4s}
.chord .nm{font-weight:700;font-size:16px}
.chord svg{width:100%;max-width:110px}
.cd-grid{stroke:var(--line2)}
.cd-nut{stroke:var(--text)}
.cd-x{fill:var(--text2)}
.cd-o{stroke:var(--text2);fill:none}
.cd-dot{fill:var(--accent)}
.cd-num{fill:#fff;font-weight:700}
.cd-fr{fill:var(--text2)}
.diagrams{display:flex;flex-wrap:wrap;gap:10px}
.diagrams .chord{width:96px}
/* timer, metronom, stroik */
.timer{display:flex;align-items:center;gap:14px}
.tring{width:64px;height:64px;flex:0 0 64px}
.tnum{font-family:var(--mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;min-width:78px}
.dm-name{font-size:20px;font-weight:700}
.dm-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 4px}
.dm-grid{display:flex;flex-direction:column;gap:4px;min-width:max-content}
.dm-row{display:flex;align-items:center;gap:3px}
.dm-lab{width:86px;flex:0 0 86px;font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--bg-elev);z-index:1}
.dm-cell{width:22px;height:26px;border:0;border-radius:6px;background:var(--fill);padding:0;transition:background .08s,transform .08s}
.dm-cell.bs{margin-left:4px}
.dm-cell.vn{background:var(--orange)}
.dm-cell.va{background:var(--pink)}
.dm-cell.vg{background:color-mix(in srgb,var(--orange) 40%,var(--fill))}
.dm-cell.ph{outline:2px solid var(--text);transform:scale(1.08)}
.dm-sel{width:100%}
.dm-presets{max-height:300px;overflow-y:auto}
.dm-presets .li.sel{background:color-mix(in srgb,var(--blue) 12%,transparent)}
.dm-presets .li.sel .chev{color:var(--blue);font-weight:700}
.dm-presets .chev{color:var(--text3,#c7c7cc);font-size:18px}
.clock-switch{max-width:360px}
.metro-top{display:flex;align-items:center;gap:18px}
.bpm-dial{width:128px;height:128px;flex:0 0 128px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:conic-gradient(from 210deg,var(--pink),var(--orange),var(--yellow),var(--pink));position:relative;box-shadow:var(--shadow)}
.bpm-dial::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg-elev)}
.bpm-dial > *{position:relative}
.bpm-dial .n{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bpm-dial .u{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.05em}
.bpm-dial.pulse{animation:beat .14s}
@keyframes beat{50%{transform:scale(1.04)}}
.beats{display:flex;gap:8px;flex-wrap:wrap}
.beat{width:20px;height:20px;border-radius:50%;background:var(--fill2);transition:background .06s,transform .06s}
.beat.on{background:var(--text);transform:scale(1.2)}
.beat.on.acc{background:var(--pink)}
.compact .bpm-dial{width:96px;height:96px;flex-basis:96px}
.compact .bpm-dial .n{font-size:30px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gauge .tick{stroke:var(--line2)}
.gauge .tick0{stroke:var(--text)}
.gauge text{fill:var(--text3);font-size:10px}
.gauge .needle{stroke:var(--accent);transition:all .12s}
.gauge .needle.in{stroke:var(--green)}
.gauge .hub{fill:var(--text)}
.gauge .arc{stroke:var(--fill2);fill:none}
.gauge .arcok{stroke:var(--green);fill:none;opacity:.5}
.note{font-size:52px;font-weight:800;line-height:1}
.note.in{color:var(--green)}
.strings{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.strings .btn{padding:8px 0;flex-direction:column;gap:0;font-size:18px}
.strings .btn small{font-size:10px;font-weight:600;opacity:.7}
.strings .btn.hit{background:var(--green);color:#fff}
.chal-n{font-family:var(--mono);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.tapbtn{width:100%;min-height:84px;font-size:20px;border-radius:20px}
/* statystyki */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:14px 16px;margin:0!important}
.chords .card,.tiles .card{margin:0}

  dia: tabD("E5 E6 E7 E8 A5 A6 A7 A8 D5 D6 D7 D8 G5 G6 G7 G8 H5 H6 H7 H8 e5 e6 e7 e8"), drill: { key: "pick", b0: 50, inc: 3, max: 120, sub: "ósemki" } });
C({ id: "folk", t: "Bicie folkowe D – DG – GDG", lv: 5, cat: "rytm", pre: ["osemki"], read: "rh",
  what: "Najpopularniejszy wzór gitary ogniskowej. To ósemki z „pominiętymi” uderzeniami — ręka pracuje dalej, ale nie dotyka strun.",
  steps: ["Graj pełne ósemki i powiedz na głos, które uderzenia pomijasz (3. i 6. ruch).", "Wzór: D, D G, G D G (licz 1, 2 i, i 4 i).", "Najpierw na jednym akordzie, potem zmiany G–D–Em–C.", "Włącz perkusję Pop i dopasuj akcenty do werbla na 2 i 4."],
  mist: ["Zatrzymanie ręki w miejscu pominięcia — wtedy gubisz puls.", "Za wczesna zmiana akordu."],
  check: "Wzór płynnie przy 90 BPM przez całą zwrotkę piosenki.",
  dia: rhD("p_folk"), drill: { key: "strum", b0: 70, inc: 3, max: 120, sub: "ósemki", groove: "pop" } });
C({ id: "sept", t: "Dm i akordy septymowe E7, A7, D7", lv: 5, cat: "akordy", pre: ["d_a_e"], read: "ch",
  what: "Dm to trzeci podstawowy akord molowy. Akordy z „7” (dominanty) mają napięcie, które „ciągnie” do następnego akordu — typowe w bluesie i przed refrenem.",
  steps: ["Dm: trójkąt G2, e1, H3; graj od struny D.", "E7: jak E, ale podnieś palec 3 (pusta D).", "A7: jak A bez palca na strunie G.", "D7: odwrócony trójkąt G2, H1, e2. Ćwicz A7→D, E7→A."],
  mist: ["W Dm palec 1 tłumi strunę H — zaokrąglij go.", "Mylenie D7 z D."],
  check: "Rozpoznajesz uchem, że E7 „chce” przejść w A, i grasz tę zmianę płynnie.",
  dia: chD("Dm", "E7", "A7", "D7"), drill: { key: "changes", b0: 20, inc: 2, max: 50, sub: "zmian/min" } });
C({ id: "kostka_alt", t: "Kostkowanie naprzemienne", lv: 6, cat: "technika", pre: ["chrom"], read: "tab",
  what: "Granie pojedynczych dźwięków ruchem dół–góra–dół–góra. To podstawa melodii, riffów i solówek.",
  hands: ["Lewa: palec na progu dokładnie w momencie uderzenia.", "Prawa: ruch z nadgarstka, kostka lekko pochylona, przedramię oparte o pudło."],
  steps: ["Graj pustą strunę e: dół–góra ósemkami 60 BPM.", "To samo na każdej strunie, potem przechodząc między strunami.", "Zagraj melodię „Oda do radości” z tabulatury.", "Tempo +3 BPM, gdy wszystko równe."],
  mist: ["Same uderzenia w dół przy szybszych frazach.", "Za duże ruchy — kostka odjeżdża daleko od struny."],
  check: "Oda do radości ósemkami przy 80 BPM ze ścisłym naprzemiennym kostkowaniem.",
  dia: tabD("H0 H0 H1 H3 H3 H1 H0 G2 G0 G0 G2 H0 H0 G2 G2"), drill: { key: "pick", b0: 60, inc: 3, max: 130, sub: "ósemki" } });
C({ id: "nuty_e", t: "Nazwy dźwięków na strunach E i A", lv: 6, cat: "teoria", read: "fret",
  what: "Gdy znasz dźwięki na dwóch najgrubszych strunach, znajdziesz każdy akord barré i power chord. W polskiej notacji: H to dźwięk „B”, a B to B♭.",
  steps: ["Zapamiętaj: między E–F i H–C nie ma krzyżyka (pół tonu).", "Struna E: 0 E, 1 F, 3 G, 5 A, 7 H, 8 C, 10 D, 12 E.", "Struna A: 0 A, 2 H, 3 C, 5 D, 7 E, 8 F, 10 G, 12 A.", "Losuj dźwięk i znajdź go na obu strunach w 3 sekundy."],
  mist: ["Zapominanie, że po H jest od razu C.", "Mylenie polskiego H z angielskim B."],
  check: "Pokazujesz dowolny dźwięk naturalny na strunie E i A w mniej niż 3 sekundy.",
  dia: fretDia([0, 1, 3, 5, 7, 8, 10, 12].map((f) => ({ s: 0, f })).concat([0, 2, 3, 5, 7, 8, 10, 12].map((f) => ({ s: 1, f }))), 4, { f0: 0, f1: 12, names: true }), drill: { key: "theory", b0: 0, inc: 0, max: 0, sub: "quiz" } });
C({ id: "basy", t: "Bas + akord (przemienny bas)", lv: 7, cat: "rytm", pre: ["folk"], read: "rh",
  what: "Zamiast uderzać wszystkie struny, grasz najpierw bas akordu, a potem resztę. Brzmi pełniej — jak gitara i bas naraz (country, szanty, walce).",
  steps: ["Znajdź bas: C → struna A, G → E, D → D, Am → A, E → E.", "Wzór: bas (1) – akord (2) – drugi bas (3) – akord (4).", "Drugi bas: w C przenieś palec 3 na E3, w G graj strunę D.", "Ćwicz C–G–Am–F mini."],
  mist: ["Trafianie w złą strunę basową.", "Bas cichszy niż akord — powinien być wyraźny."],
  check: "Bas-akord na C, G, D i Am bez pomyłki strun przy 80 BPM.",
  dia: tabD("A3 H1 E3 H1 A3 H1 E3 H1", "C: bas A – akord – bas E – akord"), drill: { key: "strum", b0: 60, inc: 3, max: 110, sub: "ćwierćnuty", groove: "walc" } });
C({ id: "stopnie", t: "Tonacja i stopnie I–IV–V", lv: 7, cat: "teoria", read: "fret",
  what: "Większość piosenek opiera się na akordach z jednej tonacji. Akordy oznaczamy stopniami (I, IV, V, vi), co pozwala grać tę samą piosenkę w dowolnej tonacji.",
  steps: ["W G-dur: I = G, IV = C, V = D, vi = Em.", "W C-dur: I = C, IV = F, V = G, vi = Am.", "W D-dur: I = D, IV = G, V = A, vi = Hm.", "Zagraj I–V–vi–IV w G i w C — usłysz, że to ta sama „piosenka”."],
  mist: ["Mylenie numeru stopnia z numerem progu."],
  check: "Podajesz I, IV, V i vi w G, C, D i A bez zastanowienia.",
  dia: chD("G", "C", "D", "Em"), drill: { key: "theory", b0: 0, inc: 0, max: 0, sub: "quiz" } });
C({ id: "ulatwiacze", t: "Fmaj7, Cadd9, Asus2/4, Dsus4", lv: 8, cat: "akordy", pre: ["c_g"], read: "ch",
  what: "Akordy „ozdobne” zmieniają tylko jeden palec, a brzmią profesjonalnie. Fmaj7 to też łatwa wersja F przed nauką barré.",
  steps: ["Fmaj7: jak C, ale przesuń palce 3 i 2 o strunę w górę (D3, G2), H1, e0.", "Cadd9: z G przesuń palce 2 i 3 o strunę (D2, A3) i dodaj H3.", "Dsus4/Dsus2: w D dołóż mały palec na e3 albo podnieś palec 2.", "Graj D–Dsus4–D–Dsus2 w ósemkach."],
  mist: ["W Fmaj7 grasz strunę E — zaczynaj od D.", "Za duże przesunięcia — szukaj wspólnych palców."],
  check: "Płynne G–Cadd9 i D–Dsus4–D przy 90 BPM.",
  dia: chD("Fmaj7", "Cadd9", "Asus4", "Dsus4"), drill: { key: "changes", b0: 25, inc: 2, max: 55, sub: "zmian/min" } });
C({ id: "pop", t: "Bicie pop z synkopą", lv: 8, cat: "rytm", pre: ["folk"], read: "rh",
  what: "Synkopa to akcent „pomiędzy” liczbami. Wzór D – DG – GDG z zatrzymaniem na „i” po 2 to brzmienie współczesnego popu.",
  steps: ["Przypomnij wzór folkowy.", "Na „3” pomiń uderzenie w dół, ale graj „i” po nim w górę.", "Akcentuj „2” i „4” (werbel w perkusji).", "Ćwicz na I–V–vi–IV w G."],
  mist: ["Zgubienie „1” po synkopie — licz na głos.", "Szarpanie ręką przy pominięciu."],
  check: "Wzór pop przy 100 BPM równo z perkusją przez minutę.",
  dia: rhD("p_pop"), drill: { key: "strum", b0: 70, inc: 3, max: 120, sub: "ósemki", groove: "pop" } });
C({ id: "hammer", t: "Hammer-on i pull-off", lv: 9, cat: "technika", pre: ["kostka_alt"], read: "tab",
  what: "Hammer-on (h) to „uderzenie” palcem w strunę, pull-off (p) to „zerwanie” palca w dół. Grasz dwa dźwięki z jednego uderzenia kostką — płynnie i szybko.",
  hands: ["Lewa: hammer czubkiem palca, szybko i blisko progu; przy pull-off ściągnij strunę lekko w dół (w stronę podłogi).", "Prawa: tylko jedno uderzenie na parę dźwięków; tłum niegrane struny."],
  steps: ["Struna G: uderz 5, młotek palcem 3 na 7 (5h7).", "Pull-off: połóż palce na 5 i 7, uderz 7 i zerwij na 5 (7p5).", "Graj 5h7p5 na każdej strunie.", "Zagraj tryl 5h7p5h7… przez 10 s."],
  mist: ["Drugi dźwięk dużo cichszy — mocniejszy, szybszy ruch palca.", "Pull-off w bok zamiast w dół."],
  check: "Oba dźwięki równie głośne; tryl 10 s bez zaniku.",
  dia: tabD("G5h7 G7p5 D5h7 D7p5 A5h7 A7p5 H5h8 H8p5"), drill: { key: "legato", b0: 50, inc: 3, max: 110, sub: "ósemki" } });
C({ id: "fp_intro", t: "Fingerpicking p-i-m-a", lv: 10, cat: "technika", pre: ["basy"], read: "tab",
  what: "Gra palcami zamiast kostką. Kciuk (p) gra basy, palce i-m-a (wskazujący, środkowy, serdeczny) struny G-H-e. Brzmi delikatnie i „pianistycznie”.",
  hands: ["Lewa trzyma akord, jak przy biciu.", "Prawa: kciuk na strunach E-A-D, i na G, m na H, a na e; nadgarstek lekko wygięty, dłoń nieruchoma."],
  steps: ["Przypisz palce do strun i graj każdy osobno.", "Wzór: p – i – m – a – m – i (arpeggio).", "Graj na C, Am, G, Em — kciuk na basie akordu.", "Metronom ósemkami 60 BPM."],
  mist: ["Ruch całą dłonią zamiast palcami.", "Kciuk trafia w złą strunę basową."],
  check: "Arpeggio p-i-m-a-m-i na 4 akordach płynnie przy 70 BPM.",
  dia: tabD("A3 G0 H1 e0 H1 G0 A0 G2 H1 e0 H1 G2", "C i Am: p-i-m-a-m-i"), drill: { key: "fp", b0: 50, inc: 3, max: 100, sub: "ósemki", groove: "ballada" } });
C({ id: "palm", t: "Palm mute i rytm rockowy", lv: 10, cat: "rytm", pre: ["osemki"], read: "rh",
  what: "Palm mute (PM) to lekkie tłumienie strun krawędzią dłoni przy mostku. Daje „mięsisty”, rytmiczny dźwięk rocka i punka.",
  hands: ["Lewa trzyma power chord albo akord otwarty.", "Prawa: krawędź dłoni (pod małym palcem) leży na strunach tuż przy mostku; same uderzenia w dół."],
  steps: ["Połóż krawędź dłoni na mostku, uderzaj pustą strunę E ósemkami.", "Przesuwaj dłoń: za blisko gryfu = głucho, za blisko mostka = bez tłumienia.", "Graj E5 ósemkami z PM, akcent bez PM na „1”.", "Włącz perkusję Rock."],
  mist: ["Dłoń zbyt daleko — dźwięk zamiera zupełnie.", "Ruchy w górę — w PM grasz zwykle tylko w dół."],
  check: "Ósemki w dół z PM przy 120 BPM przez minutę, równo z perkusją.",
  dia: rhD("p_pm"), drill: { key: "strum", b0: 80, inc: 4, max: 160, sub: "ósemki", groove: "rock" } });
C({ id: "power", t: "Power chordy (E5, A5, G5…)", lv: 11, cat: "akordy", pre: ["nuty_e", "palm"], read: "ch",
  what: "Akord z dwóch–trzech dźwięków (pryma + kwinta). Ten sam kształt przesuwasz po gryfie — podstawa rocka. Bas na strunie E lub A wyznacza nazwę.",
  steps: ["Palec 1 na strunie E (np. 3. próg = G), palec 3 dwa progi wyżej na strunie A.", "Graj tylko te 2–3 struny, resztę tłum palcem 1.", "Przesuwaj: G5 (3), A5 (5), C5 (8).", "To samo od struny A: C5 (A3), D5 (A5)."],
  mist: ["Dzwonią puste struny — tłum je bokiem palca 1.", "Złe miejsce — sprawdź nazwy dźwięków na strunach E/A."],
  check: "Riff G5–A5–C5–A5 z PM przy 110 BPM, bez dzwoniących strun.",
  dia: chD("E5", "A5", "G5|E", "C5|A"), drill: { key: "changes", b0: 30, inc: 3, max: 70, sub: "zmian/min" } });
C({ id: "f_mini", t: "Małe F i Hm (przygotowanie do barré)", lv: 12, cat: "barre", pre: ["ulatwiacze"], read: "ch",
  what: "F i Hm w wersji na 4 struny — palec 1 dociska dwie struny naraz. To „małe barré”, które przygotowuje rękę do pełnego.",
  hands: ["Lewa: palec 1 płasko na strunach H i e (1. próg dla F), lekko obrócony na kostkę od strony główki; kciuk niżej za gryfem.", "Prawa: graj tylko 4 cienkie struny."],
  steps: ["F mały: palec 1 na H1+e1, 2 na G2, 3 na D3.", "Hm (4 struny): palec 1 na e2, 2 na H3, 3 na D4, 4 na G4; graj od struny D.", "Zagraj strunę po strunie, popraw brzęczące.", "Zmiany C–F, G–Hm."],
  mist: ["Palec 1 nie dociska struny H — przetocz go odrobinę na bok.", "Ściskanie kciukiem do bólu — siła z ciężaru ręki."],
  check: "F mały i Hm czyste, zmiana C↔F 20+ razy na minutę.",
  dia: chD("F (mały)", "Hm|A"), drill: { key: "changes", b0: 12, inc: 2, max: 40, sub: "zmian/min" } });
C({ id: "rytm16", t: "Szesnastki — liczenie 1 e i a", lv: 12, cat: "rytm", pre: ["pop"], read: "rh",
  what: "Szesnastki dzielą każde uderzenie na 4 części. Liczysz „1 e i a 2 e i a…”. To klucz do funku, reggae i nowoczesnego popu.",
  steps: ["Wolno (60 BPM): dół-góra-dół-góra na każde uderzenie metronomu.", "Akcentuj „1” i „i”.", "Pomijaj niektóre uderzenia, nie zatrzymując ręki.", "Perkusja Funk w tempie 70."],
  mist: ["Ręka zwalnia przy pominięciach.", "Za mocne uderzenia — w szesnastkach graj lżej, z nadgarstka."],
  check: "Szesnastki przy 80 BPM przez minutę z akcentami na 2 i 4.",
  dia: rhD("p_16"), drill: { key: "strum", b0: 55, inc: 3, max: 100, sub: "szesnastki", groove: "funk" } });
C({ id: "riffy", t: "Pierwsze riffy na grubych strunach", lv: 13, cat: "technika", pre: ["kostka_alt", "power"], read: "tab",
  what: "Riff to krótki, powtarzany motyw melodyczny. Łączy kostkowanie, tłumienie i rytm — świetnie rozwija koordynację.",
  steps: ["Zagraj riff bluesowy z tabulatury wolno.", "Dołóż palm mute na pustych strunach.", "Graj w pętli 8 razy bez błędu.", "Perkusja Shuffle — granie z „bujaniem”."],
  mist: ["Dzwonią puste struny — tłum je lewą ręką.", "Przyspieszanie w łatwych miejscach."],
  check: "Riff w pętli przy 100 BPM bez błędu 8 razy z rzędu.",
  dia: tabD("A0 A0 A4 A4 A5 A5 A4 A4 D0 D0 D4 D4 D5 D5 D4 D4"), drill: { key: "pick", b0: 70, inc: 3, max: 140, sub: "ósemki", groove: "shuffle" } });
C({ id: "skale_intro", t: "Wprowadzenie do skal", lv: 14, cat: "skale", pre: ["nuty_e", "kostka_alt"], read: "fret",
  what: "Skala to zestaw dźwięków, z których zbudowane są melodie i solówki w danej tonacji. Na gitarze uczymy się skal jako „kształtów” (pozycji) — jeden palec na jeden próg. Pryma (dźwięk podstawowy, np. A) to „dom”, do którego melodia wraca.",
  hands: ["Lewa: zasada „1 palec = 1 próg” — w pozycji V palec 1 gra 5. próg, palec 4 8. próg. Ręka nie skacze, tylko palce.", "Prawa: kostkowanie naprzemienne, jedna nuta na klik."],
  steps: ["Na mapie gryfu znajdź pomarańczowe kropki — to prymy (A na 5. progu E).", "Zagraj same prymy: E5, D7, e5.", "Zagraj dźwięki na jednej strunie w górę i w dół, wymawiając ich nazwy.", "Zrozum: skala durowa brzmi radośnie, molowa smutno, pentatonika (5 dźwięków) — „gitarowo”."],
  mist: ["Uczenie się kształtu bez słuchania prymy — zawsze zaczynaj i kończ na prymie.", "Skakanie ręką zamiast zasady 1 palec = 1 próg."],
  check: "Pokazujesz prymę A w 3 miejscach i wyjaśniasz, czym różni się pozycja od skali.",
  dia: fretDia([{ s: 0, f: 5 }, { s: 2, f: 7 }, { s: 5, f: 5 }, { s: 3, f: 2 }, { s: 1, f: 0 }, { s: 1, f: 12 }], 9, { f0: 0, f1: 12, names: true }), drill: { key: "theory", b0: 0, inc: 0, max: 0, sub: "quiz" } });
C({ id: "penta1", t: "Pentatonika molowa — 1. pozycja", lv: 15, cat: "skale", pre: ["skale_intro"], read: "fret",
  what: "Najważniejsza skala gitary rockowej i bluesowej: 5 dźwięków, 2 na każdej strunie. W A-moll leży na 5.–8. progu. Na niej zbudowane są tysiące solówek.",
  hands: ["Lewa: palce 1 i 3 na strunach D, G (5 i 7), palce 1 i 4 na E, H, e (5 i 8), na A palce 1 i 3. Palec 1 zostaje na 5. progu jak „kotwica”.", "Prawa: kostkowanie naprzemienne — dwa dźwięki na strunę = dół-góra."],
  steps: ["Zagraj z tabulatury w górę od E5 do e8, potem w dół.", "Zatrzymuj się na prymach A (pomarańczowe).", "Metronom: ćwierćnuty, potem ósemki.", "Zagraj 3 dowolne dźwięki i wróć na A — pierwsza improwizacja!"],
  mist: ["Granie palcem 3 tam, gdzie powinien być 4 — rozciągnięcie przyjdzie z czasem.", "Brak powrotu na prymę — melodia „wisi”."],
  check: "Pozycja w górę i w dół ósemkami przy 80 BPM bez błędu i z pamięci.",
  dia: pentaBox(9, 5, 8), drill: { key: "scale", b0: 60, inc: 3, max: 140, sub: "ósemki", tab: T("E5 E8 A5 A7 D5 D7 G5 G7 H5 H8 e5 e8 e5 H8 H5 G7 G5 D7 D5 A7 A5 E8 E5"), groove: "rock" } });
C({ id: "barre_e", t: "Barré w kształcie E (F, G, A…)", lv: 15, cat: "barre", pre: ["f_mini", "power", "nuty_e"], read: "ch",
  what: "Pełne barré: palec 1 dociska wszystkie 6 strun, a pozostałe palce tworzą kształt E. Przesuwając go, zagrasz każdy akord durowy — nazwa = dźwięk na strunie E pod palcem 1.",
  hands: ["Lewa: palec 1 prosto, tuż przy progu, lekko obrócony na kość; łokieć bliżej tułowia; kciuk za gryfem na wysokości palca 2. Ciężar ręki zamiast ściskania.", "Prawa: zagraj strunę po strunie, by znaleźć brzęczącą."],
  steps: ["Sam palec 1 na 1. progu — zagraj 6 strun, aż wszystkie dźwięczą.", "Dołóż kształt E palcami 2-3-4 → F.", "Przesuń na 3. próg → G, na 5. → A.", "Zmiany C–F, F–G, krótkie serie (5 min max, potem przerwa)."],
  mist: ["Struny H i G brzęczą — przesuń palec 1 bliżej progu, obróć na kość.", "Ból po 2 minutach — za mocno ściskasz kciukiem."],
  check: "F barré: wszystkie 6 strun czyste, utrzymane 10 s; 15+ zmian C↔F na minutę.",
  dia: chD("F|E", "G|E", "A|E"), drill: { key: "changes", b0: 8, inc: 2, max: 40, sub: "zmian/min" } });
C({ id: "slide_bend", t: "Pierwszy slide i bend", lv: 16, cat: "technika", pre: ["penta1"], read: "tab",
  what: "Slide (/) to ślizg palcem po strunie do innego progu, bend (b) to podciągnięcie struny w górę, by podnieść dźwięk. To „wokal” gitary solowej.",
  hands: ["Lewa: bend palcem 3 wspieranym przez 2 i 1 (wszystkie trzy pchają strunę); ruch obrotowy nadgarstka, nie samymi palcami.", "Prawa: jedno uderzenie, potem tłum sąsiednie struny."],
  steps: ["Slide: G5/7 — palec nie odrywa się od struny.", "Bend: G7 podciągnij o pół tonu, porównaj z G8.", "Bend na cały ton: G7b9 — porównaj z G9 (musi brzmieć tak samo).", "Zagraj lick z tabulatury."],
  mist: ["Bend za nisko (fałsz) — zawsze sprawdzaj z dźwiękiem docelowym.", "Bend jednym palcem — ból i brak kontroli."],
  check: "Bend pół- i całotonowy trafia w docelowy dźwięk (porównanie z progiem).",
  dia: tabD("G5/7 G7b9 G9 H8 H5 G7 G5"), drill: { key: "lick", b0: 60, inc: 2, max: 110, sub: "ósemki", groove: "shuffle" } });
C({ id: "shuffle", t: "Shuffle — ósemki „z bujaniem”", lv: 16, cat: "rytm", pre: ["power"], read: "rh",
  what: "Shuffle to swingowane ósemki: pierwsza długa, druga krótka (ta-da, ta-da). Serce bluesa i rock'n'rolla.",
  steps: ["Powiedz „ta—da ta—da”, jak trioli z pominiętym środkiem.", "Riff boogie: pusta A + D2, potem pusta A + D4 (palec 1 na D2, palec 3 na D4).", "Perkusja Shuffle 80 BPM i dopasuj się do hi-hatu.", "Graj 12 taktów bluesa w A."],
  mist: ["Ósemki proste zamiast swingowanych.", "Przyspieszanie przy zmianach."],
  check: "12 taktów shuffle przy 90 BPM z perkusją bez zgubienia „bujania”.",
  dia: tabD("A0 D2 A0 D2 A0 D4 A0 D4 A0 D2 A0 D2 A0 D4 A0 D4"), drill: { key: "strum", b0: 70, inc: 3, max: 130, sub: "triole", groove: "shuffle" } });
C({ id: "barre_em", t: "Barré molowe w kształcie Em", lv: 17, cat: "barre", pre: ["barre_e"], read: "ch",
  what: "Ten sam pomysł co barré E, ale palce tworzą kształt Em. Dostajesz wszystkie akordy molowe: Fm (1), Gm (3), Am (5), Hm (7).",
  steps: ["Z F barré podnieś palec 2 — masz Fm.", "Przesuń na 3. próg → Gm.", "Sprawdź strunę G — teraz trzyma ją sam palec 1.", "Ćwicz F–Fm–G–Gm."],
  mist: ["Struna G brzęczy — palec 1 musi być dokładnie przy progu.", "Zbyt mocne ściskanie."],
  check: "Fm, Gm i Am barré czyste; Am (otwarty) ↔ Gm barré 20+ razy na minutę.",
  dia: chD("Fm|E", "Gm|E", "Hm|E"), drill: { key: "changes", b0: 10, inc: 2, max: 40, sub: "zmian/min" } });
C({ id: "dur_skala", t: "Skala durowa — 1. pozycja", lv: 18, cat: "skale", pre: ["skale_intro"], read: "fret",
  what: "Do-re-mi-fa-sol-la-si-do: 7 dźwięków, z których zbudowane są akordy i melodie w tonacji. Uczymy G-dur od 2. progu struny E (3 lub 2 dźwięki na strunę).",
  steps: ["Zaśpiewaj „do-re-mi…” i zagraj to samo z tabulatury.", "Zatrzymuj się na G (pryma).", "Graj w górę i w dół ósemkami.", "Zagraj melodię „Wlazł kotek” w tej pozycji."],
  mist: ["Pomylenie Fis z F — w G-dur zawsze Fis.", "Zbyt duże rozciągnięcia — użyj zasady 1 palec = 1 próg z przesunięciem."],
  check: "Skala G-dur 2 oktawy w górę i w dół przy 70 BPM ósemkami.",
  dia: fretDia(boxNotes(7, IV.maj, 2, 5), 7, { f0: 1, f1: 6, iv: true }), drill: { key: "scale", b0: 50, inc: 3, max: 130, sub: "ósemki", tab: T("E3 E5 A2 A3 A5 D2 D4 D5 G2 G4 G5 H3 H5 e2 e3") } });
C({ id: "dynamika", t: "Akcenty i dynamika", lv: 18, cat: "rytm", pre: ["pop"], read: "rh",
  what: "Dynamika to granie ciszej i głośniej, akcenty — mocniejsze pojedyncze uderzenia. Zwrotka cicho, refren mocno — piosenka „oddycha”.",
  steps: ["Graj ósemki: akcent na 2 i 4.", "Zwrotka (4 takty) cicho, refren (4 takty) głośno.", "Crescendo przez 4 takty.", "Nagraj się i posłuchaj różnicy."],
  mist: ["Przyspieszanie przy głośniejszym graniu.", "Akcent przez szarpnięcie całą ręką."],
  check: "Słyszalna różnica głośności zwrotka/refren bez zmiany tempa.",
  dia: rhD("p_pop"), drill: { key: "strum", b0: 70, inc: 3, max: 130, sub: "ósemki", groove: "pop" } });
C({ id: "blues12", t: "12-taktowy blues", lv: 19, cat: "teoria", pre: ["shuffle", "penta1", "sept"], read: "fret",
  what: "Najsłynniejsza forma muzyczna: 12 taktów na akordach I–IV–V (w A: A7, D7, E7). Na niej grasz rytm shuffle i solówki z pentatoniki.",
  steps: ["Układ: A7 ×4, D7 ×2, A7 ×2, E7, D7, A7, E7 (turnaround).", "Zagraj shuffle przez całą formę z perkusją.", "Druga runda: solo z pentatoniki A-moll.", "Liczenie taktów na palcach."],
  mist: ["Gubienie się w formie — licz takty.", "Za wczesne przejście na D7."],
  check: "Dwie rundy 12 taktów bez zgubienia formy (rytm + solo).",
  dia: chD("A7", "D7", "E7"), drill: { key: "strum", b0: 70, inc: 3, max: 130, sub: "triole", groove: "shuffle" } });

/* ============================== KONCEPCJE — ŚREDNIO ZAAWANSOWANY 1–20 ============================== */
C({ id: "barre_a", t: "Barré w kształcie A (B, H, C, D…)", lv: 20, cat: "barre", pre: ["barre_e"], read: "ch",
  what: "Drugi kształt barré: palec 1 na 5 strunach (od A), palce tworzą kształt A. Nazwa = dźwięk na strunie A pod palcem 1: B (1), H (2), C (3), D (5). Razem z kształtem E masz każdy akord durowy w dwóch miejscach gryfu.",
  hands: ["Lewa: palec 1 barré od struny A; palce 2-3-4 na strunach D-G-H dwa progi wyżej (albo palec 3 jako mini-barré na trzech strunach, struna e wtedy cichnie).", "Prawa: nie graj struny E (tłum ją czubkiem palca 1)."],
  steps: ["H-dur: barré na 2. progu, palce 2-3-4 na 4. progu strun D-G-H.", "Wersja z palcem 3 jako mini-barré — sprawdź, co wygodniejsze.", "Przesuń: C (3), D (5), E (7).", "Zmiany E-barré ↔ A-barré: F (1. próg E) ↔ B (1. próg A)."],
  mist: ["Dzwoni struna E — oprzyj na niej czubek palca 1.", "Struna e zagłuszona — przy mini-barré odegnij palec 3 w stawie."],
  check: "H, C i D w kształcie A czyste; progresja G–H–C–D barré płynnie przy 80 BPM.",
  dia: chD("B|A", "H|A", "C|A"), drill: { key: "changes", b0: 15, inc: 2, max: 45, sub: "zmian/min" } });
C({ id: "barre_am", t: "Barré molowe w kształcie Am (Hm, Cm, Dm…)", lv: 21, cat: "barre", pre: ["barre_a", "barre_em"], read: "ch",
  what: "Kształt Am z palcem 1 jako barré od struny A. Hm na 2. progu to jeden z najczęstszych akordów w polskich piosenkach.",
  steps: ["Hm: barré na 2. progu, palce 3 i 4 na D4, G4, palec 2 na H3.", "Przesuń: Cm (3), Dm (5), Em (7).", "Sprawdź każdą strunę osobno.", "Progresja D–Hm–G–A (wszystko z barré A i E)."],
  mist: ["Struna H nie gra — palec 2 za mało zaokrąglony.", "Kciuk za wysoko — „łapanie gryfu jak kija”."],
  check: "Hm czyste, zmiana G↔Hm 25+ razy na minutę.",
  dia: chD("Hm|A", "Cm|A", "Dm|A"), drill: { key: "changes", b0: 15, inc: 2, max: 50, sub: "zmian/min" } });
C({ id: "penta2", t: "Pentatonika — 2. pozycja", lv: 21, cat: "skale", pre: ["penta1"], read: "fret",
  what: "Pentatonika ma 5 pozycji, które łączą się jak puzzle na całym gryfie. Druga pozycja (A-moll: progi 7–10) zaczyna się od górnych dźwięków pierwszej.",
  steps: ["Porównaj mapę: dolne dźwięki pozycji 2 = górne pozycji 1.", "Zagraj w górę i w dół z tabulatury.", "Połącz: pozycja 1 w górę → ślizg do 2 na strunie G → pozycja 2 w dół.", "Improwizuj 1 minutę na podkładzie w A-moll, używając obu."],
  mist: ["Gubienie prym — w pozycji 2 pryma A jest na D7 i H10.", "Granie pozycji „mechanicznie” bez słuchania."],
  check: "Pozycje 1 i 2 połączone ślizgiem, ósemki przy 80 BPM.",
  dia: pentaBox(9, 7, 10), drill: { key: "scale", b0: 60, inc: 3, max: 140, sub: "ósemki", tab: T("E8 E10 A7 A10 D7 D10 G7 G9 H8 H10 e8 e10"), groove: "rock" } });
C({ id: "barre7", t: "Akordy septymowe barré: 7, m7, maj7", lv: 22, cat: "akordy", pre: ["barre_am"], read: "ch",
  what: "Z kształtów E i A tworzysz akordy z septymą, zmieniając jeden palec. Potrzebne w bluesie, soulu, jazzie i bossie.",
  steps: ["E7-barré: z F podnieś palec 4 → F7.", "Em7-barré: z Fm podnieś palec 3 → Fm7.", "A7-barré: z H podnieś palec ze struny G → H7; Am7: z Hm podnieś palec 4.", "Progresja II–V–I: Am7 (5) – D7 (5, A-kształt) – Gmaj7 (3)."],
  mist: ["Przy podniesionym palcu struna przestaje grać — palec 1 musi ją docisnąć.", "Mylenie maj7 z 7."],
  check: "Rozpoznajesz uchem 7 / m7 / maj7 i grasz je w obu kształtach.",
  dia: chD("F7|E", "Fm7|E", "H7|A", "Hm7|A"), drill: { key: "changes", b0: 20, inc: 2, max: 50, sub: "zmian/min" } });
C({ id: "vibrato", t: "Vibrato", lv: 22, cat: "technika", pre: ["slide_bend"], read: "tab",
  what: "Vibrato (~) to rytmiczne lekkie podciąganie struny, które sprawia, że dźwięk „śpiewa”. Rozpoznawalne vibrato to podpis gitarzysty.",
  hands: ["Lewa: ruch obrotowy nadgarstka (jak przekręcanie klamki), palec dociska, kciuk może zaczepić o gryf.", "Prawa: jedno uderzenie, tłum pozostałe struny."],
  steps: ["H8 palcem 3, równe podciągnięcia ćwierćnutami 60 BPM.", "Potem ósemki, potem triole.", "Vibrato na dźwięku po bendzie (b~).", "Zagraj frazę kończącą się vibrato."],
  mist: ["Nierówne, „nerwowe” vibrato — trzymaj puls.", "Za szerokie vibrato fałszuje."],
  check: "Równe vibrato ósemkami 80 BPM przez 4 takty na każdym palcu 1–3.",
  dia: tabD("H8~ H5 G7 G5 G7b9~"), drill: { key: "lick", b0: 60, inc: 2, max: 100, sub: "ósemki" } });
C({ id: "caged", t: "System CAGED", lv: 23, cat: "teoria", pre: ["barre_a", "barre_e", "penta2"], read: "ch",
  what: "Każdy akord durowy da się zagrać w 5 kształtach (C, A, G, E, D) w różnych miejscach gryfu. CAGED łączy akordy, skale i arpeggia w jedną mapę.",
  steps: ["Zagraj C-dur w 5 kształtach: C (otwarty), A (3.), G (5.), E (8.), D (10.).", "Znajdź prymę C w każdym kształcie.", "Zrób to samo dla G.", "Połącz z pentatonikami: każdy kształt CAGED „siedzi” na jednej pozycji."],
  mist: ["Uczenie kształtów bez znajomości pryma — zawsze znajdź prymę.", "Próba grania pełnych 6 strun w G i C kształcie — używaj fragmentów."],
  check: "C i G w 5 kształtach CAGED w mniej niż 30 sekund.",
  dia: chD("C", "C|A", "C|E"), drill: { key: "changes", b0: 15, inc: 2, max: 40, sub: "kształtów/min" } });
C({ id: "penta3", t: "Pentatonika — 3. pozycja", lv: 23, cat: "skale", pre: ["penta2"], read: "fret",
  what: "Trzecia pozycja (A-moll: progi 9/10–13) — tu zaczyna się „górna” część gryfu, idealna do bendów na strunach H i G.",
  steps: ["Zagraj z mapy w górę i w dół.", "Bend na strunie G (12b14) — typowy rockowy dźwięk.", "Łącz pozycje 2 i 3.", "Improwizuj, przechodząc przez pozycje 1–3."],
  mist: ["Zbyt duże rozciągnięcia — przesuwaj rękę.", "Brak orientacji gdzie jest A."],
  check: "Pozycje 1–3 łączone płynnie przy 80 BPM.",
  dia: pentaBox(9, 10, 13), drill: { key: "scale", b0: 60, inc: 3, max: 140, sub: "ósemki", tab: T("E10 E12 A10 A12 D10 D12 G9 G12 H10 H13 e10 e12"), groove: "rock" } });
C({ id: "triady", t: "Triady na 3 górnych strunach", lv: 24, cat: "akordy", pre: ["caged"], read: "ch",
  what: "Triada to akord z trzech dźwięków (1-3-5). Na strunach G-H-e masz 3 przewroty każdego akordu — idealne do drugiej gitary, funku i ozdobników.",
  steps: ["C-dur: postać zasadnicza (G5 H5 e3), 1. przewrót z tercją w basie (G9 H8 e8), 2. przewrót z kwintą w basie (G12 H13 e12).", "Graj przewroty po kolei w górę gryfu.", "To samo dla molowej Am.", "Progresja C–Am–F–G samymi triadami w jednym obszarze gryfu."],
  mist: ["Dzwonią niższe struny — graj tylko 3 struny.", "Szukanie każdej triady od nowa — myśl o najbliższym przewrocie."],
  check: "C, F, G, Am jako triady na G-H-e w jednym obszarze (5.–10. próg) przy 70 BPM.",
  dia: fretDia([{ s: 3, f: 5 }, { s: 4, f: 5 }, { s: 5, f: 3 }, { s: 3, f: 9 }, { s: 4, f: 8 }, { s: 5, f: 8 }, { s: 3, f: 12 }, { s: 4, f: 13 }, { s: 5, f: 12 }], 0, { f0: 3, f1: 13, iv: true }), drill: { key: "changes", b0: 20, inc: 2, max: 50, sub: "zmian/min" } });
C({ id: "alt_fast", t: "Szybkie kostkowanie: szesnastki", lv: 24, cat: "technika", pre: ["kostka_alt", "chrom"], read: "tab",
  what: "Szybkie, równe szesnastki to podstawa solówek i riffów metalowych. Kluczowa jest synchronizacja rąk i ekonomia ruchu, nie siła.",
  hands: ["Lewa: palce nisko, minimalny nacisk potrzebny do czystego dźwięku.", "Prawa: ruch z nadgarstka (lub przedramienia przy szybkich tempach), kostka pod lekkim kątem, czubek ledwo wchodzi między struny."],
  steps: ["Jedna struna, jeden dźwięk: szesnastki przy 60 BPM przez 30 s.", "4 nuty na strunę (chromatyka) szesnastkami.", "Metoda „burst”: 4 nuty szybko, pauza; potem 8, potem 16.", "Podnoś tempo o 4 BPM tylko gdy 3 razy z rzędu czysto."],
  mist: ["Napięte ramię — rozluźnij bark, oddychaj.", "Lewa ręka nie nadąża — zwolnij, szukaj synchronizacji."],
  check: "Szesnastki na jednej strunie przy 100 BPM i chromatyka przy 80 BPM, czysto 30 s.",
  dia: tabD("E5 E6 E7 E8 A5 A6 A7 A8 D5 D6 D7 D8 G5 G6 G7 G8"), drill: { key: "pick", b0: 60, inc: 3, max: 160, sub: "szesnastki" } });
C({ id: "penta45", t: "Pentatonika — 4. i 5. pozycja (cały gryf)", lv: 25, cat: "skale", pre: ["penta3"], read: "fret",
  what: "Ostatnie dwie pozycje zamykają koło: po 5. pozycji wracasz do 1. oktawę wyżej. Znając wszystkie 5, improwizujesz na całym gryfie w każdej tonacji.",
  steps: ["Pozycja 4: progi 12–15, pozycja 5: 15–17 (albo 3–5 oktawę niżej).", "Graj każdą w górę i w dół.", "Przejdź „po przekątnej” przez wszystkie 5 pozycji na strunach E→e.", "Przenieś całość do E-moll i G-moll."],
  mist: ["Uczenie tylko w A — od razu transponuj.", "Myślenie „pudełkami” bez łączników."],
  check: "Wszystkie 5 pozycji A-moll ósemkami przy 80 BPM i 3 pozycje w E-moll.",
  dia: pentaBox(9, 12, 17), drill: { key: "scale", b0: 60, inc: 3, max: 150, sub: "ósemki", tab: T("E12 E15 A12 A15 D12 D14 G12 G14 H13 H15 e12 e15"), groove: "rock" } });
C({ id: "funk16", t: "Funk: szesnastki i martwe uderzenia", lv: 25, cat: "rytm", pre: ["rytm16", "triady"], read: "rh",
  what: "Gitara funkowa to perkusja z dźwiękiem: ręka cały czas „pracuje” szesnastkami, a lewa ręka zwalnia nacisk, robiąc stłumione „cziki” (×). Akordy 9 i triady na górnych strunach.",
  hands: ["Lewa: trzyma E9 (lub triadę) i rytmicznie zwalnia nacisk — struny głuchną, ale palce nie odrywają się.", "Prawa: nieprzerwane szesnastki z nadgarstka, lekki dotyk."],
  steps: ["Same × szesnastkami przy 70 BPM (lewa zwolniona).", "Akcent z dźwiękiem na „1” i „i” po 2.", "Wzór z siatki rytmu na E9.", "Perkusja Funk: wpasuj „cziki” w hi-hat."],
  mist: ["Ręka zatrzymuje się — funk wymaga ciągłego ruchu.", "Za mocne uderzenia, zbyt dużo strun."],
  check: "Wzór funkowy przy 90 BPM przez minutę z perkusją, akcenty czytelne.",
  dia: rhD("p_16"), drill: { key: "strum", b0: 65, inc: 3, max: 115, sub: "szesnastki", groove: "funk" } });
C({ id: "bend_full", t: "Bendy z intonacją: cały ton, pre-bend, release", lv: 26, cat: "technika", pre: ["vibrato"], read: "tab",
  what: "Dokładne bendy to różnica między amatorem a profesjonalistą. Uczymy pełnego bendu, pre-bendu (podciągasz przed uderzeniem) i release (powrót).",
  steps: ["Zagraj H15 (dźwięk docelowy), potem bend z H13 do tej samej wysokości.", "Pre-bend: podciągnij H13 o cały ton bez uderzenia, uderz i opuść (release).", "Bend + vibrato na szczycie.", "Lick z tabulatury: bend z vibrato, potem zejście po pentatonice."],
  mist: ["Bend niedociągnięty — porównuj z dźwiękiem docelowym przez stroik.", "Hałas sąsiednich strun — tłum je."],
  check: "Pełny bend na strunach G i H trafia w ton docelowy (stroik ±10 centów).",
  dia: tabD("H15 H13b15 H13b15r13 G14b16~ G12 H13 H12"), drill: { key: "lick", b0: 60, inc: 2, max: 110, sub: "ósemki", groove: "shuffle" } });
C({ id: "travis", t: "Travis picking", lv: 26, cat: "technika", pre: ["fp_intro"], read: "tab",
  what: "Kciuk gra stały, naprzemienny bas (jak metronom), a palce dokładają melodię „pomiędzy”. Styl country, folku i ballad (np. Dust in the Wind, The Boxer).",
  hands: ["Lewa: akord C/G/Am, przy basie przemiennym w C palec 3 skacze między A3 i E3.", "Prawa: kciuk (p) na struny 5-4 / 6-4, i na G, m na H; dłoń oparta lekko małym palcem o pudło (opcjonalnie)."],
  steps: ["Sam kciuk: A–D–A–D (C-dur) ćwierćnutami 60 BPM — ma być automatyczny.", "Dołóż m na „i” po 1 i i na „i” po 2.", "Pełny wzór z tabulatury.", "C–Am–F–G Travisem."],
  mist: ["Kciuk zwalnia, gdy palce grają — ćwicz sam kciuk dłużej.", "Palce za głośno w stosunku do basu."],
  check: "Travis na C–Am–F–G przy 80 BPM przez minutę bez zatrzymania kciuka.",
  dia: tabD("A3 H1 D2 G0 A3 H1 D2 G0"), drill: { key: "fp", b0: 50, inc: 3, max: 110, sub: "ósemki", groove: "ballada" } });
C({ id: "maj7", t: "Akordy 7, m7, maj7 — budowa i brzmienie", lv: 27, cat: "teoria", pre: ["barre7", "stopnie"], read: "ch",
  what: "Akord czterodźwiękowy = triada + septyma. maj7 (wielka septyma) — marzycielski, m7 — miękki, 7 (mała septyma na durze) — napięty, bluesowy. Każdy stopień tonacji ma swój typ: Imaj7, IIm7, IIIm7, IVmaj7, V7, VIm7, VIIm7♭5.",
  steps: ["Zagraj Cmaj7, Dm7, Em7, Fmaj7, G7, Am7 — akordy C-dur.", "Posłuchaj: który brzmi „najbardziej niespokojnie”? (G7).", "Zbuduj Gmaj7 i G7 z mapy interwałów.", "Progresja Imaj7–VIm7–IIm7–V7 w C."],
  mist: ["Mylenie oznaczeń (Cmaj7 ≠ C7).", "Uczenie bez słuchania różnic."],
  check: "Rozpoznajesz maj7/m7/7 ze słuchu w 8 na 10 przypadków.",
  dia: chD("Cmaj7", "Dm7", "G7", "Am7"), drill: { key: "changes", b0: 20, inc: 2, max: 50, sub: "zmian/min" } });
C({ id: "legato", t: "Legato: serie hammer-on/pull-off", lv: 27, cat: "technika", pre: ["hammer", "penta2"], read: "tab",
  what: "Legato to granie wielu dźwięków z jednego uderzenia — płynne, „śpiewające” frazy (Satriani, Vai, ale też folk). Buduje siłę lewej ręki.",
  steps: ["Tryle 1-2, 1-3, 1-4 na każdej strunie po 15 s.", "Pentatonika legato: tylko pierwsze uderzenie na strunę.", "Zstępujące pull-offy w pozycji 1.", "Metronom: triole."],
  mist: ["Nierówna głośność dźwięków.", "Szarpanie strun przy pull-off w górę."],
  check: "Pentatonika legato w górę i w dół triolami przy 80 BPM, równo.",
  dia: tabD("E5h8 A5h7 D5h7 G5h7 H5h8 e5h8 e8p5 H8p5 G7p5 D7p5 A7p5 E8p5"), drill: { key: "legato", b0: 60, inc: 3, max: 140, sub: "triole" } });
C({ id: "nps3", t: "Skala durowa: 3 dźwięki na strunę (3NPS)", lv: 28, cat: "skale", pre: ["dur_skala", "alt_fast"], read: "fret",
  what: "Układ 3NPS (trzy dźwięki na każdej strunie) daje 7 kształtów skali durowej. Symetryczny układ ułatwia szybkie granie — kostkowanie i legato.",
  steps: ["G-dur od E3: 3-5-7, A3-5-7, D4-5-7… z tabulatury.", "Kostkowanie naprzemienne: każda struna zaczyna się raz w dół, raz w górę.", "Sekwencja „po 3” (1-2-3, 2-3-4…).", "Przesuń wzór do A-dur i C-dur."],
  mist: ["Zbyt duże rozciągnięcia palcami 1–4 — przesuń kciuk.", "Nierówna praca kostki przy zmianie strun."],
  check: "Skala G-dur 3NPS 2 oktawy szesnastkami przy 70 BPM.",
  dia: fretDia(npsNotes(0, 3, 7, IV.maj, 3), 7, { f0: 2, f1: 10, iv: true }), drill: { key: "scale", b0: 60, inc: 3, max: 160, sub: "szesnastki", tab: notesTab(npsNotes(0, 3, 7, IV.maj, 3)) } });
C({ id: "sluch1", t: "Trening słuchu: interwały i dur/moll", lv: 28, cat: "teoria", pre: ["maj7"], read: "fret",
  what: "Słuch muzyczny pozwala grać „to, co słyszysz w głowie”, zdejmować piosenki i improwizować. Zaczynamy od odróżniania dur/moll i rozpoznawania podstawowych interwałów.",
  steps: ["Zagraj A i Am — nazwij różnicę (jasny/smutny).", "Interwały od A: tercja mała (C), wielka (Cis), kwarta (D), kwinta (E), oktawa.", "Skojarz z piosenkami: kwarta = początek „Marsz weselny”, kwinta = „Gwiezdne wojny”.", "Quiz: ktoś (albo Ty z zamkniętymi oczami) gra losowo — zgaduj."],
  mist: ["Zgadywanie bez śpiewania — zaśpiewaj interwał.", "Za długie sesje — 5 minut dziennie wystarczy."],
  check: "8/10 trafień dur/moll i 7/10 dla kwarty/kwinty/oktawy.",
  dia: fretDia([{ s: 1, f: 0 }, { s: 1, f: 3 }, { s: 1, f: 4 }, { s: 1, f: 5 }, { s: 1, f: 7 }, { s: 1, f: 12 }], 9, { f0: 0, f1: 12, iv: true }), drill: { key: "ear", b0: 0, inc: 0, max: 0, sub: "quiz" } });
C({ id: "slides", t: "Ślizgi i przejścia między pozycjami", lv: 29, cat: "technika", pre: ["penta45", "vibrato"], read: "tab",
  what: "Ślizgi łączą pozycje skali i nadają frazom płynność. Gitarzysta, który gra tylko w pudełkach, brzmi sztywno.",
  steps: ["Ślizg palcem 3 na strunie G: 7/9, 9/12, 12/14.", "Fraza przechodząca z pozycji 1 do 3 ślizgami.", "Ślizg „do nikąd” na końcu frazy (\\).", "Improwizuj, używając ślizgu co dwie frazy."],
  mist: ["Ślizg bez docisku — dźwięk zanika.", "Przeskok zamiast ślizgu."],
  check: "Fraza przez 3 pozycje z 2 ślizgami, czysto przy 80 BPM.",
  dia: tabD("G5 G7/9 H8 H10 e8 e10/12 H13 H10 G12/14~"), drill: { key: "lick", b0: 60, inc: 2, max: 120, sub: "ósemki", groove: "rock" } });
C({ id: "ext", t: "Akordy rozszerzone: add9, 9, 6, sus", lv: 29, cat: "akordy", pre: ["maj7"], read: "ch",
  what: "Dodanie nony (9), seksty (6) albo zamiana tercji na kwartę/sekundę (sus) daje akordom kolor — brzmienie popu, soulu i jazzu.",
  steps: ["Cadd9, Am(add9) — otwarte.", "E9 i A9 — funkowe akordy na górnych strunach.", "C6, Am6 — brzmienie retro.", "Asus2–A–Asus4–A: ruch melodii w akordzie."],
  mist: ["Pomylenie add9 z 9 (9 zawiera septymę).", "Za mocne uderzenia w delikatne akordy."],
  check: "Grasz add9, 9, 6, sus2/sus4 od C, A i E i rozpoznajesz brzmienie.",
  dia: chD("Cadd9", "E9", "C6", "Asus2"), drill: { key: "changes", b0: 20, inc: 2, max: 50, sub: "zmian/min" } });
C({ id: "mody_intro", t: "Wprowadzenie do skal modalnych", lv: 30, cat: "skale", pre: ["nps3", "maj7"], read: "fret",
  what: "Mody (skale modalne) to skala durowa grana od innego dźwięku. Np. dźwięki C-dur od D to D-dorycka. Każdy mod ma charakter: dorycka — molowa z jasną sekstą, miksolidyjska — durowa z małą septymą (rock, blues).",
  steps: ["Zagraj C-dur od C, potem te same dźwięki od D do D.", "Nagraj podkład Dm7 i graj na nim — poczuj „dorycki” klimat.", "Porównaj D-dorycką z D-moll (różni się H zamiast B).", "Zagraj G-miksolidyjską (od G w C-dur) na G7."],
  mist: ["Granie modu bez akordu tła — mod słychać tylko na właściwej harmonii.", "Myślenie „to tylko C-dur” — liczy się pryma i nuty charakterystyczne."],
  check: "Słyszysz różnicę dorycka vs moll na podkładzie i wskazujesz nutę charakterystyczną (6 / ♭7).",
  dia: fretDia(npsNotes(1, 5, 2, IV.dor, 3), 2, { f0: 4, f1: 10, iv: true }), drill: { key: "scale", b0: 60, inc: 3, max: 150, sub: "ósemki", tab: notesTab(npsNotes(1, 5, 2, IV.dor, 3)), groove: "funk" } });
C({ id: "impro1", t: "Improwizacja: frazy, pytanie–odpowiedź", lv: 30, cat: "teoria", pre: ["penta45", "slides"], read: "fret",
  what: "Improwizacja to mówienie dźwiękami. Zamiast biegać po skali, buduj krótkie frazy z pauzami, powtarzaj motyw i odpowiadaj na niego — jak w rozmowie.",
  steps: ["Wybierz 3 dźwięki z pentatoniki i graj tylko nimi minutę.", "Pytanie (2 takty) – pauza – odpowiedź (2 takty) kończąca na prymie.", "Powtórz motyw, zmieniając rytm.", "Włącz perkusję Shuffle i graj 12 taktów bluesa."],
  mist: ["Granie bez przerw — pauza to część frazy.", "Bieganie po skali w górę i w dół."],
  check: "Minuta solo z co najmniej 3 rozpoznawalnymi powtórzonymi motywami i pauzami.",
  dia: pentaBox(9, 5, 8), drill: { key: "impro", b0: 70, inc: 2, max: 120, sub: "frazy", groove: "shuffle" } });
C({ id: "strum_adv", t: "Zaawansowane bicie: akcenty, chuck, synkopy", lv: 31, cat: "rytm", pre: ["funk16", "dynamika"], read: "rh",
  what: "Perkusyjny „chuck” (uderzenie z wytłumieniem dłonią na 2 i 4) i przesunięte akcenty dają brzmienie akustycznego popu (Ed Sheeran, Mumford & Sons).",
  hands: ["Lewa: akordy, czasem zwolnienie na ×.", "Prawa: na 2 i 4 uderzasz w dół, równocześnie kładąc wewnętrzną część dłoni na strunach (chuck)."],
  steps: ["Sam chuck na 2 i 4, ósemki puste.", "Wzór D × D G – G × D G.", "Akcent na „i” po 3 — synkopa.", "Graj z perkusją Pop."],
  mist: ["Chuck za głośny / za cichy względem akordów.", "Utrata ósemkowego ruchu."],
  check: "Wzór z chuckiem przy 95 BPM przez cały utwór.",
  dia: rhD("p_pop"), drill: { key: "strum", b0: 70, inc: 3, max: 130, sub: "ósemki", groove: "pop" } });
C({ id: "dorycka", t: "Skala dorycka w praktyce", lv: 32, cat: "skale", pre: ["mody_intro"], read: "fret",
  what: "Dorycka to „jaśniejsza moll” — brzmienie Santany, Pink Floyd (Another Brick), funku i jazzu na akordzie m7. Pentatonika molowa + 2 i 6.",
  steps: ["A-dorycka: pentatonika A-moll + H i Fis.", "Podkład Am7–D7 (typowy dorycki vamp).", "Akcentuj Fis na D7 — usłysz kolor.", "Zagraj 3 frazy, każda z nutą Fis."],
  mist: ["Granie F zamiast Fis (to już eolska/moll).", "Za dużo nut — wystarczy dodać Fis do pentatoniki."],
  check: "Improwizacja 1 min na Am7–D7 z wyraźnym użyciem seksty Fis.",
  dia: fretDia(boxNotes(9, IV.dor, 4, 8), 9, { f0: 4, f1: 8, iv: true }), drill: { key: "impro", b0: 70, inc: 2, max: 120, sub: "frazy", groove: "funk" } });
C({ id: "kadencje", t: "Funkcje harmoniczne i kadencje", lv: 32, cat: "teoria", pre: ["maj7"], read: "ch",
  what: "Tonika (I) — spokój, subdominanta (IV) — oddalenie, dominanta (V) — napięcie. Kadencja V–I zamyka frazę. Rozumiejąc funkcje, przewidzisz akordy w piosence.",
  steps: ["Zagraj I–IV–V–I w C, G, D.", "Wstaw V7 przed I — mocniejsze rozwiązanie.", "Kadencja zwodnicza V–vi (G–Am).", "Posłuchaj piosenki i oznacz funkcje akordów."],
  mist: ["Uczenie definicji bez słuchania."],
  check: "Ze słuchu rozpoznajesz V–I vs V–vi i nazywasz funkcje w 3 piosenkach.",
  dia: chD("C", "F", "G7", "Am"), drill: { key: "ear", b0: 0, inc: 0, max: 0, sub: "quiz" } });
C({ id: "miks", t: "Miksolidyjska i akordy dominantowe", lv: 33, cat: "skale", pre: ["mody_intro"], read: "fret",
  what: "Miksolidyjska to dur z małą septymą — brzmienie rocka (Sweet Home Alabama), bluesa i country na akordach 7.",
  steps: ["A-miksolidyjska: A-dur z G zamiast Gis.", "Podkład A–G–D (I–♭VII–IV).", "Mieszaj z pentatoniką durową.", "Fraza kończąca się na Cis (tercja) na akordzie A."],
  mist: ["Granie Gis — to już zwykła dur.", "Lądowanie na „brzydkich” nutach na zmianach."],
  check: "Improwizacja 1 min na A–G–D, słyszalna ♭7.",
  dia: fretDia(boxNotes(9, IV.mix, 4, 7), 9, { f0: 4, f1: 8, iv: true }), drill: { key: "impro", b0: 70, inc: 2, max: 130, sub: "frazy", groove: "rock" } });
C({ id: "dwudzwieki", t: "Dwudźwięki: tercje i seksty", lv: 33, cat: "technika", pre: ["triady"], read: "tab",
  what: "Granie dwóch dźwięków naraz (double stops) w tercjach i sekstach — brzmienie soulu (Hendrix „Little Wing”), country i rock'n'rolla.",
  steps: ["Seksty na strunach G i e w C-dur — z tabulatury.", "Tercje na strunach H i e.", "Hammer-on w dwudźwięku.", "Dodaj ozdobniki do progresji C–F–G."],
  mist: ["Dzwoni struna między dwudźwiękami — tłum ją palcem lewej ręki.", "Nierówna głośność dźwięków."],
  check: "Seksty w C-dur przez całą oktawę przy 70 BPM.",
  dia: tabD("G5 e5 G7 e7 G9 e8 G10 e10 G12 e12"), drill: { key: "lick", b0: 60, inc: 2, max: 110, sub: "ósemki" } });
C({ id: "blues_adv", t: "Blues: 9-tki, turnaroundy, blues molowy", lv: 34, cat: "rytm", pre: ["blues12", "ext"], read: "ch",
  what: "Rozbudowany blues: akordy 9 (A9, D9, E9), quick change (IV w 2. takcie), turnaround w ostatnich 2 taktach i blues molowy (Am7–Dm7–E7).",
  steps: ["Quick change: A9 | D9 | A9 | A9…", "Turnaround: A–A7/G–D/Fis–Dm/F–A/E–E7.", "Blues molowy: Am7 ×4, Dm7 ×2, Am7 ×2, F7, E7, Am, E7.", "Graj z perkusją Shuffle i Ballada."],
  mist: ["Zgubienie formy przy quick change.", "Turnaround zbyt wolno — ćwicz osobno."],
  check: "Dwie formy (durowa z quick change i molowa) bez pomyłek przy 90 BPM.",
  dia: chD("A9|A", "D9|A", "E9"), drill: { key: "strum", b0: 70, inc: 3, max: 130, sub: "triole", groove: "shuffle" } });
C({ id: "sluch2", t: "Słuch: akordy i progresje ze słuchu", lv: 35, cat: "teoria", pre: ["sluch1", "kadencje"], read: "ch",
  what: "Rozpoznawanie progresji I–IV–V–vi ze słuchu pozwala zdejmować piosenki w kilka minut. Szukasz basu, potem dur/moll.",
  steps: ["Zagraj bas I–V–vi–IV w C i zaśpiewaj.", "Puść piosenkę: znajdź toniczny dźwięk (na czym kończy się refren).", "Szukaj basu akordów na strunie A/E.", "Sprawdź dur/moll każdym akordem."],
  mist: ["Szukanie akordów od razu — najpierw bas i tonika."],
  check: "Zdejmujesz progresję z 2 piosenek pop bez podglądania (sprawdź z bazą utworów).",
  dia: chD("C", "G", "Am", "F"), drill: { key: "ear", b0: 0, inc: 0, max: 0, sub: "quiz" } });
C({ id: "offbeat", t: "Reggae, ska i bossa nova", lv: 36, cat: "rytm", pre: ["strum_adv", "barre7"], read: "rh",
  what: "Rytmy „na offbeat”: w reggae gitara gra krótkie akordy na 2 i 4 (lub „i”), w bossie kciuk gra bas, a palce synkopowane akordy maj7/m7.",
  steps: ["Reggae: krótkie uderzenia w dół na 2 i 4, od razu tłum lewą ręką (perkusja Reggae).", "Ska: uderzenia w górę na każde „i”.", "Bossa: kciuk na 1 i 3 (bas), palce wzór synkopowany na Cmaj7–Dm7.", "Perkusja Bossa nova 120 BPM."],
  mist: ["Długie akordy — w reggae akord musi być krótki.", "Bas w bossie nierówny."],
  check: "Reggae i bossa po 2 minuty z perkusją bez zgubienia offbeatu.",
  dia: rhD("p_reggae"), drill: { key: "strum", b0: 70, inc: 3, max: 130, sub: "ósemki", groove: "reggae" } });
C({ id: "pentadur", t: "Pentatonika durowa i mieszanie dur/moll", lv: 37, cat: "skale", pre: ["penta45", "miks"], read: "fret",
  what: "Pentatonika durowa (1-2-3-5-6) to ten sam kształt co molowa, przesunięty o 3 progi w dół. Mieszanie obu to sekret B.B. Kinga i Claptona.",
  steps: ["A-dur pentatonika: kształt 1. pozycji od 2. progu (prymą jest palec 4 na E5).", "Graj na podkładzie A–D–E (country/rock).", "Mieszaj: tercja wielka Cis i mała C (bend z C do Cis).", "Licki B.B. Kinga: „box” na strunach H/e."],
  mist: ["Granie durowej na molowym podkładzie.", "Lądowanie na złej tercji na akordzie."],
  check: "Improwizacja 1 min w A-dur z wyraźnym mieszaniem C/Cis.",
  dia: pentaBox(9, 2, 5, IV.pmaj), drill: { key: "impro", b0: 70, inc: 2, max: 130, sub: "frazy", groove: "shuffle" } });
C({ id: "transpo", t: "Transpozycja, kapodaster, system Nashville", lv: 38, cat: "teoria", pre: ["kadencje"], read: "ch",
  what: "Przenoszenie piosenek do innej tonacji, żeby pasowały do głosu. Kapodaster zmienia tonację bez zmiany chwytów; system numeryczny (1–4–5–6m) pozwala grać w każdej tonacji.",
  steps: ["Zapisz piosenkę numerami (G–D–Em–C = 1–5–6m–4).", "Przenieś do A i do E.", "Kapodaster na 2. progu + chwyty z G = A-dur.", "Policz, gdzie dać kapodaster, by z C wyszło D."],
  mist: ["Mylenie kierunku (kapodaster podnosi tonację).", "Zapominanie o molowych stopniach."],
  check: "Transponujesz 4-akordową piosenkę do 3 tonacji w głowie w 1 minutę.",
  dia: chD("G", "D", "Em", "C"), drill: { key: "theory", b0: 0, inc: 0, max: 0, sub: "quiz" } });
C({ id: "impro2", t: "Improwizacja na zmianach akordów (nuty akordowe)", lv: 39, cat: "teoria", pre: ["impro1", "triady", "pentadur"], read: "fret",
  what: "Zaawansowana improwizacja „słyszy” zmiany: na każdym akordzie celujesz w jego nuty (1-3-5), szczególnie tercję. Solo brzmi melodyjnie, nie tylko „skalowo”.",
  steps: ["Progresja Am–F–C–G: znajdź tercje (C, A, E, H) w jednej pozycji.", "Graj tylko nuty akordowe półnutami.", "Dodaj nuty przejściowe między nimi.", "Swobodne solo z lądowaniem na tercji na „1”."],
  mist: ["Ignorowanie zmian — granie samej pentatoniki.", "Nuty docelowe w złym momencie (po zmianie)."],
  check: "Solo 16 taktów, w którym na „1” każdego taktu trafiasz w nutę akordu.",
  dia: fretDia(boxNotes(9, [0, 3, 7], 5, 8), 9, { f0: 5, f1: 8, iv: true }), drill: { key: "impro", b0: 70, inc: 2, max: 130, sub: "frazy", groove: "pop" } });

/* ============================== KONCEPCJE — ZAAWANSOWANY 1–20 ============================== */
const fd = (pairs, root, f0, f1) => fretDia(pairs.map(([s, f]) => ({ s, f })), root, { f0, f1, iv: true });
C({ id: "arp_triady", t: "Arpeggia triad — kształty CAGED", lv: 40, cat: "skale", pre: ["caged", "triady"], read: "fret",
  what: "Arpeggio to akord grany dźwięk po dźwięku. Arpeggia triad (1-3-5) w kształtach CAGED to podstawa melodycznych solówek i sweep pickingu.",
  steps: ["A-dur arpeggio w kształcie E (5. próg) z mapy.", "Graj w górę i w dół, nazywając interwały 1-3-5.", "To samo dla Am (tercja o próg niżej).", "Arpeggia na zmianach A–D–E w jednej pozycji."],
  mist: ["Dźwięki zlewają się jak akord — tłum poprzedni dźwięk.", "Granie bez wiedzy, który dźwięk to tercja."],
  check: "Arpeggia A, D, E i Am w 2 kształtach ósemkami przy 90 BPM.",
  dia: fretDia(boxNotes(9, [0, 4, 7], 4, 7), 9, { f0: 4, f1: 8, iv: true }), drill: { key: "arp", b0: 60, inc: 3, max: 150, sub: "ósemki", tab: T("E5 A4 A7 D7 G6 H5 e5 e9 e5 H5 G6 D7 A7 A4 E5") } });
C({ id: "sweep3", t: "Sweep picking — 3 struny", lv: 41, cat: "technika", pre: ["arp_triady", "alt_fast"], read: "tab",
  what: "Sweep to „przeciągnięcie” kostki przez kilka strun jednym ruchem, jak powolne bicie, przy czym lewa ręka gra po jednym dźwięku. Pozwala grać szybkie arpeggia (Yngwie, Becker).",
  hands: ["Lewa: każdy palec dociska tylko w momencie grania swojej nuty i od razu zwalnia (rolling dla dwóch nut na tym samym progu).", "Prawa: jeden ciągły ruch w dół przez struny G-H-e i w górę z powrotem; kostka „opiera się” o następną strunę."],
  steps: ["Am triada na G-H-e: G14, H13, e12 — wolno, jeden ruch w dół.", "Na e: hammer/pull (12h17p12), potem sweep w górę.", "Metronom: triole 50 BPM.", "Zmiany Am–C–D–Em."],
  mist: ["Dźwięki brzmią razem (jak akord) — lewa ręka musi tłumić.", "Rozdzielne uderzenia zamiast jednego ruchu."],
  check: "Sweep 3-strunowy triolami przy 80 BPM, każda nuta osobno słyszalna.",
  dia: tabD("G14 H13 e12h17p12 H13 G14"), drill: { key: "sweep", b0: 50, inc: 3, max: 140, sub: "triole" } });
C({ id: "hybrid", t: "Hybrid picking (kostka + palce)", lv: 42, cat: "technika", pre: ["travis", "alt_fast"], read: "tab",
  what: "Kostka gra niższe struny, a palce m i a — wyższe. Pozwala grać skoki przez struny, akordy z basem i country „chicken picking”.",
  hands: ["Lewa: jak zwykle.", "Prawa: kostka między kciukiem a palcem wskazującym, palce m (środkowy) i a (serdeczny) szarpią struny H i e — podciągają je lekko do góry."],
  steps: ["Kostka na D, palec m na H, a na e — arpeggio C-dur.", "Pinch: bas kostką + e palcem a naraz.", "Lick country z tabulatury.", "Szybkie skoki przez struny (oktawy)."],
  mist: ["Palce za słabo — dźwięk cichszy niż kostka.", "Kostka ucieka, gdy palce grają."],
  check: "Arpeggio C–Am–F–G hybrid picking przy 90 BPM ósemkami.",
  dia: tabD("A3 H1 D2 e0 A3 H1 D2 e0"), drill: { key: "fp", b0: 60, inc: 3, max: 130, sub: "ósemki", groove: "pop" } });
C({ id: "tapping", t: "Tapping", lv: 43, cat: "technika", pre: ["legato"], read: "tab",
  what: "Tapping (t) to „uderzanie” palcem prawej ręki w gryf jak hammer-on. Łączy się z legato lewej ręki — szybkie, szerokie interwały (Van Halen „Eruption”).",
  hands: ["Lewa: legato hammer/pull, tłumi niegrane struny.", "Prawa: palec środkowy (kostka zostaje w dłoni) uderza i „zrywa” strunę w dół lub w górę jak pull-off."],
  steps: ["Struna H: t12 p5 h8 (powtarzaj triolami).", "Zmieniaj nutę tappingu: 12, 13, 15.", "Przenieś na strunę G.", "Tłum struny dłonią prawej ręki."],

  check: "Tapping triolami 3 nuty przez 30 s przy 100 BPM, czysto.",

C({ id: "jazz_shell", t: "Jazzowe akordy shell (1-3-7)", lv: 44, cat: "akordy", pre: ["maj7", "barre7"], read: "fret",
  what: "Shell voicings to akordy z trzech kluczowych dźwięków: pryma, tercja, septyma. Lekkie, przejrzyste brzmienie jazzowego akompaniamentu.",
  steps: ["Gmaj7: E3, D4, G4. G7: E3, D3, G4. Gm7: E3, D3, G3.", "Te same kształty od struny A (Cmaj7: A3, G4, H5).", "II–V–I w C: Dm7 (A5) – G7 (E3) – Cmaj7 (A3).", "Graj ćwierćnutami (styl Freddiego Greena)."],
  mist: ["Dzwonią puste struny — tłum je.", "Pomylenie tercji (dur/moll) w kształcie."],
  check: "Shell maj7/7/m7 od strun E i A dla 4 tonacji.",
  dia: fd([[0, 3], [2, 4], [3, 4]], 7, 2, 6), drill: { key: "changes", b0: 20, inc: 2, max: 60, sub: "zmian/min", groove: "swing" } });
C({ id: "ii_v_i", t: "Progresja II–V–I", lv: 45, cat: "teoria", pre: ["jazz_shell", "kadencje"], read: "ch",
  what: "II–V–I (Dm7–G7–Cmaj7) to najważniejsza progresja jazzu i bossy. Septyma jednego akordu schodzi o półton do tercji następnego — to „prowadzenie głosów”.",
  steps: ["Zagraj II–V–I w C, F, B, Es (shell).", "Wariant molowy: Hm7♭5–E7–Am.", "Na podkładzie: arpeggio każdego akordu.", "Perkusja Swing 120 BPM."],
  mist: ["Skakanie po gryfie — szukaj najbliższego kształtu.", "Brak różnicy dur/moll II–V–I."],
  check: "II–V–I w 4 tonacjach i molowe w 2, bez zatrzymywania przy 120 BPM.",
  dia: chD("Dm7", "G7", "Cmaj7"), drill: { key: "changes", b0: 20, inc: 2, max: 60, sub: "zmian/min", groove: "swing" } });
C({ id: "arp7", t: "Arpeggia septymowe", lv: 46, cat: "skale", pre: ["arp_triady", "ii_v_i"], read: "fret",
  what: "Arpeggia czterodźwiękowe (1-3-5-7) — maj7, m7, 7, m7♭5. Grając je na II–V–I, brzmisz „jazzowo” i melodyjnie.",
  steps: ["Gmaj7 arpeggio z 3. progu E.", "G7 i Gm7 w tej samej pozycji (zmieniasz 1–2 dźwięki).", "Na II–V–I: Am7–D7–Gmaj7 arpeggia w jednej pozycji.", "Łączenie: ostatnia nuta jednego = najbliższa nuta następnego."],
  mist: ["Granie od prymy zawsze — zacznij od najbliższego dźwięku."],
  check: "Arpeggia II–V–I w G ósemkami przy 100 BPM bez przerw.",
  dia: fretDia(boxNotes(7, [0, 4, 7, 11], 2, 5), 7, { f0: 1, f1: 6, iv: true }), drill: { key: "arp", b0: 60, inc: 3, max: 150, sub: "ósemki", groove: "swing" } });
C({ id: "sweep5", t: "Sweep 5-strunowy", lv: 47, cat: "technika", pre: ["sweep3"], read: "tab",
  what: "Arpeggia przez 5 strun (kształt A) — pełne, efektowne kaskady. Wymaga precyzyjnego tłumienia obu rąk.",
  steps: ["Am kształt A (5. próg struny A → e).", "Wolno, każda nuta osobno; rolling palcem na D i G.", "Dodaj tapping na szczycie.", "Am–F–G–E w pętli."],
  mist: ["Rolling — dwie nuty brzmią naraz.", "Za szybko za wcześnie."],
  check: "Sweep 5-strunowy szesnastkami przy 70 BPM czysto.",

C({ id: "modal_impro", t: "Improwizacja modalna", lv: 48, cat: "teoria", pre: ["dorycka", "miks", "arp7"], read: "fret",
  what: "Na jednym akordzie (vamp) grasz mod, podkreślając jego nutę charakterystyczną: dorycka — 6, miksolidyjska — ♭7, lidyjska — #4, frygijska — ♭2.",
  steps: ["Vamp Dm7 (So What): D-dorycka, akcent na H.", "Vamp G7: G-miksolidyjska, akcent na F.", "Vamp Fmaj7#11: F-lidyjska, akcent na H.", "Nagraj podkład i graj 2 minuty każdego."],
  mist: ["Granie „C-dur” bez celowania w prymę modu.", "Za dużo nut, mało frazowania."],
  check: "Słuchacz rozpoznaje charakter modu w Twoim solo (nuta charakterystyczna na mocnych częściach).",
  dia: fretDia(boxNotes(2, IV.dor, 5, 8), 2, { f0: 4, f1: 9, iv: true }), drill: { key: "impro", b0: 70, inc: 2, max: 130, sub: "frazy", groove: "funk" } });
C({ id: "hmin", t: "Moll harmoniczna", lv: 49, cat: "skale", pre: ["nps3", "ii_v_i"], read: "fret",
  what: "Moll z podwyższonym 7. stopniem (A-moll z Gis). Daje „orientalne”, neoklasyczne brzmienie i akord E7 w tonacji molowej.",
  steps: ["A-moll harmoniczna 3NPS z mapy.", "Graj na E7 → Am.", "Arpeggio Gis-zmniejszone (Gis-H-D-F).", "Neoklasyczna sekwencja po 4."],
  mist: ["Granie G zamiast Gis.", "Nadużywanie — celuj w Gis na E7."],
  check: "Skala 2 oktawy szesnastkami przy 80 BPM + fraza E7→Am.",
  dia: fretDia(npsNotes(0, 5, 9, IV.hmin, 3), 9, { f0: 4, f1: 10, iv: true }), drill: { key: "scale", b0: 60, inc: 3, max: 160, sub: "szesnastki", tab: notesTab(npsNotes(0, 5, 9, IV.hmin, 3)) } });
C({ id: "drop2", t: "Akordy drop 2", lv: 50, cat: "akordy", pre: ["jazz_shell"], read: "fret",
  what: "Drop 2 to czterodźwiękowe akordy na 4 sąsiednich strunach (D-G-H-e), w 4 przewrotach. Melodyjny, „fortepianowy” akompaniament jazzowy.",
  steps: ["Cmaj7 drop 2 na D-G-H-e: D10 (C), G9 (E), H8 (G), e7 (H) — postać zasadnicza.", "Cztery przewroty Cmaj7 w górę gryfu.", "To samo dla Dm7 i G7.", "II–V–I z najmniejszymi ruchami palców."],
  mist: ["Szukanie każdego chwytu od zera — myśl przewrotami.", "Brzęczące struny przez rozciągnięcia."],
  check: "4 przewroty maj7/m7/7 drop 2 dla C i F.",
  dia: fd([[2, 10], [3, 9], [4, 8], [5, 7]], 0, 6, 11), drill: { key: "changes", b0: 15, inc: 2, max: 50, sub: "zmian/min", groove: "bossa" } });
C({ id: "mmin", t: "Moll melodyczna (jazzowa)", lv: 51, cat: "skale", pre: ["hmin"], read: "fret",
  what: "Moll z podwyższonym 6. i 7. stopniem (A-H-C-D-E-Fis-Gis). Jej mody dają skalę alterowaną i lidyjską dominantową — słownik współczesnego jazzu.",
  steps: ["A-moll melodyczna 3NPS.", "Graj na Am(maj7) i Am6.", "Lidyjska dominantowa (od D) na D7#11.", "Porównaj z dorycką."],
  mist: ["Mylenie z harmoniczną.", "Granie bez akordu tła."],
  check: "Skala 2 oktawy przy 80 BPM i fraza na Am6.",
  dia: fretDia(npsNotes(0, 5, 9, IV.mmin, 3), 9, { f0: 4, f1: 10, iv: true }), drill: { key: "scale", b0: 60, inc: 3, max: 160, sub: "szesnastki", tab: notesTab(npsNotes(0, 5, 9, IV.mmin, 3)) } });
C({ id: "economy", t: "Economy picking", lv: 52, cat: "technika", pre: ["sweep3", "nps3"], read: "tab",
  what: "Połączenie kostkowania naprzemiennego i sweepu: przy zmianie struny kostka idzie dalej w tym samym kierunku. Płynne, szybkie skale 3NPS (Gambale, Malmsteen).",
  steps: ["3NPS: D-G-D na strunie E, potem D (sweep) na A.", "Zaznacz kierunki kostki na tabulaturze.", "Skala 3NPS w górę economy, w dół alternate.", "Metronom triolami."],
  mist: ["Nierówny rytm przy sweepie między strunami.", "Mieszanie kierunków przypadkowo."],
  check: "Skala 3NPS 2 oktawy triolami przy 100 BPM economy.",
  dia: tabD("E5 E7 E8 A5 A7 A8 D5 D7 D9 G5 G7 G9"), drill: { key: "pick", b0: 60, inc: 3, max: 170, sub: "triole" } });
C({ id: "lyd_phr", t: "Lidyjska i frygijska", lv: 53, cat: "skale", pre: ["modal_impro"], read: "fret",
  what: "Lidyjska (dur z #4) — marzycielska, filmowa (Satriani „Flying in a Blue Dream”). Frygijska (moll z ♭2) — hiszpańska, metalowa.",
  steps: ["F-lidyjska (w C-dur od F) na Fmaj7.", "E-frygijska na E–F (flamenco/metal).", "Frygijska dominantowa (z Gis) — dźwięk flamenco.", "Improwizuj po minucie każdą."],
  mist: ["Brak akcentu na #4 / ♭2."],
  check: "Fraza w każdym modzie, słyszalna nuta charakterystyczna.",
  dia: fretDia(boxNotes(4, IV.phr, 0, 3), 4, { f0: 0, f1: 4, iv: true }), drill: { key: "impro", b0: 70, inc: 2, max: 130, sub: "frazy", groove: "metal" } });
C({ id: "odd", t: "Metra nieparzyste: 5/4 i 7/8", lv: 54, cat: "rytm", pre: ["funk16"], read: "rh",
  what: "Metrum 5/4 („Take Five”) i 7/8 (muzyka bałkańska, prog rock) dzielimy na grupy 2 i 3: 7/8 = 2+2+3. Liczenie grup to klucz.",
  steps: ["Licz 7/8: „raz-dwa, raz-dwa, raz-dwa-trzy”.", "Perkusja 7/8 — graj akordy na początku grup.", "5/4 = 3+2: riff na Em.", "Perkusja 5/4, potem bez perkusji."],
  mist: ["Dodawanie ósemki (powrót do 4/4)."],
  check: "16 taktów 7/8 i 5/4 z perkusją bez zgubienia „raz”.",
